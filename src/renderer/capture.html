<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: tasken-attachment:; connect-src 'self' http://localhost:* ws://localhost:*;"
    />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { color-scheme: light; }
      :root[data-theme="dark"] { color-scheme: dark; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: var(--font-base);
        font-size: var(--text-base);
        color: var(--color-text);
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
      }
      .capture-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        height: 100%;
        min-width: 0;
        overflow: auto;
      }
      .capture-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        gap: 8px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .capture-header strong {
        font-size: 12px;
        color: var(--color-accent);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .capture-hint {
        font-size: 11px;
        color: var(--color-text-secondary);
        -webkit-app-region: no-drag;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .due-preview {
        display: none;
        min-height: 18px;
        font-size: 11px;
        color: var(--color-success-strong);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .due-preview.is-visible { display: block; }
      .due-preview.is-error { color: var(--color-danger); }
      .range-choice {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        font-size: 11px;
        color: var(--color-text-secondary);
      }
      .range-choice[hidden] { display: none; }
      .range-choice button {
        min-height: 26px;
        padding: 2px 8px;
        border-color: var(--color-border);
        background: var(--color-surface);
        color: var(--color-text);
        font-size: 11px;
      }
      .range-choice button:hover,
      .range-choice button.is-selected { border-color: var(--color-accent); background: var(--color-accent-subtle-bg); color: var(--color-accent-strong); }
      .range-choice > span { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mode-pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid var(--color-accent-subtle-bd);
        border-radius: 999px;
        color: var(--color-accent-strong);
        background: var(--color-accent-subtle-bg);
        font-size: 11px;
        font-weight: 700;
        -webkit-app-region: no-drag;
      }
      .theme-row {
        display: none;
        grid-template-columns: 56px 1fr;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--color-text-secondary);
      }
      .theme-row.is-visible { display: grid; }
      select {
        min-height: 28px;
        padding: 3px 8px;
        border: 1px solid var(--color-border);
        border-radius: 7px;
        background: var(--color-surface);
        color: inherit;
        font: inherit;
        font-size: 12px;
        outline: none;
      }
      select:focus {
        border-color: var(--color-accent);
        box-shadow: var(--focus-ring);
      }
      textarea {
        flex: 1;
        min-height: 60px;
        padding: 8px;
        border: 1px solid var(--color-border);
        border-radius: 7px;
        background: var(--color-surface);
        font: inherit;
        font-size: 13px;
        color: inherit;
        resize: none;
        outline: none;
      }
      textarea:focus {
        border-color: var(--color-accent);
        box-shadow: var(--focus-ring);
      }
      .capture-actions {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
        flex: 0 0 auto;
        position: sticky;
        bottom: 0;
        background: var(--color-bg);
        padding-top: 4px;
      }
      button {
        min-height: 30px;
        padding: 4px 14px;
        border: 1px solid var(--color-accent);
        border-radius: 7px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      button:hover { background: var(--color-accent-hover); }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      [hidden] { display: none !important; }
      .secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
      .secondary:hover { background: var(--color-bg); }
      .organization { display: grid; gap: 8px; flex: 0 0 auto; }
      .organization label { display: grid; gap: 4px; font-size: 12px; }
      .organization input { min-width: 0; padding: 6px; color: inherit; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 7px; font: inherit; }
      .organization input:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .organization textarea { min-height: 64px; }
      .organization-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .candidate-row { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
      .candidate-row select { min-width: 0; flex: 1; }
      #organization-empty { font-size: 12px; }
      #organization-status, #organization-warnings { font-size: 12px; white-space: pre-wrap; }
      #original-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; max-height: 160px; overflow: auto; }
      .feedback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-weight: 600;
        font-size: 13px;
        animation: fade-out 0.8s ease 0.3s forwards;
        pointer-events: none;
      }
      .feedback.error {
        padding: 12px;
        background: var(--color-danger);
        text-align: center;
        animation: none;
      }
      @keyframes fade-out {
        to { opacity: 0; }
      }
      #saved-source label { display: grid; gap: var(--space-1); font-size: var(--text-sm); }
      #saved-source input { min-width: 0; padding: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); }
      #saved-source p { margin-block: var(--space-2); }
    </style>
  </head>
  <body>
    <div class="capture-form">
      <div class="capture-header">
        <strong id="title">Inbox に記録</strong>
        <span id="mode-pill" class="mode-pill">Inbox</span>
      </div>
      <span id="hint" class="capture-hint">Ctrl+Enter で記録 / Shift追加で続ける / Escで閉じる</span>
      <div id="saved-source" hidden>
        <p id="saved-source-date" class="capture-hint"></p>
        <label>入力時のタイムゾーン<input id="saved-source-zone" placeholder="例: Asia/Tokyo" aria-label="入力時のタイムゾーン"></label>
        <p id="saved-source-policy" class="capture-hint"></p>
      </div>
      <div id="candidate-row" class="candidate-row" hidden>
        <select id="candidate-select" aria-label="編集する整理案"></select>
        <button id="candidate-remove" class="secondary" type="button">この案を除外</button>
      </div>
      <p id="organization-empty" hidden>追加する案はありません。元の入力に戻して整理し直せます。</p>
      <label id="theme-row" class="theme-row">
        <span>Theme</span>
        <select id="theme-select">
          <option value="">個人業務 / Themeなし</option>
        </select>
      </label>
      <textarea id="input" placeholder="タスク・メモ・アイデア" autofocus></textarea>
      <span id="due-preview" class="due-preview" role="status" aria-live="polite"></span>
      <div id="range-choice" class="range-choice" hidden aria-label="日付範囲の意味"></div>
      <section id="organization" class="organization" hidden aria-label="整理案を確認">
        <div class="organization-dates">
          <label>開始日<input id="organization-start" type="date"></label>
          <label>期限<input id="organization-end" type="date"></label>
        </div>
        <div class="organization-dates">
          <label>予定開始<input id="organization-time" type="time"></label>
          <label>所要時間（分）<input id="organization-duration" type="number" min="1" max="10080" step="1"></label>
        </div>
        <label>期間の意味<select id="organization-range"><option value="">未指定</option><option value="once_within_window">期間内に一度</option><option value="ongoing">期間中継続</option></select></label>
        <label>チェック項目（1行に1件）<textarea id="organization-checklist"></textarea></label>
        <label>補足<textarea id="organization-supplement" maxlength="12000"></textarea></label>
        <p id="organization-warnings" role="status"></p>
        <details><summary>元の入力</summary><p id="original-text"></p></details>
        <button id="organization-restore" class="secondary" type="button">元の入力に戻す</button>
      </section>
      <p id="organization-status" role="status" aria-live="polite"></p>
      <div class="capture-actions">
        <button id="saved-source-return" class="secondary" type="button" hidden>元Captureへ戻る</button>
        <button id="organize" class="secondary" type="button" hidden>AIで整理</button>
        <button id="submit" type="button">記録する</button>
      </div>
    </div>
    <div id="feedback" class="feedback" style="display:none">Inbox整理に記録しました</div>
    <script>
      const input = document.getElementById("input");
      const submitButton = document.getElementById("submit");
      const feedback = document.getElementById("feedback");
      const title = document.getElementById("title");
      const modePill = document.getElementById("mode-pill");
      const themeRow = document.getElementById("theme-row");
      const themeSelect = document.getElementById("theme-select");
      const hint = document.getElementById("hint");
      const duePreview = document.getElementById("due-preview");
      const rangeChoice = document.getElementById("range-choice");
      let mode = "inbox";
      let lastThemeId = localStorage.getItem("tasken:quick-capture:last-theme-id") || "";
      let selectedRangeSemantics = "";
      let previewRequest = 0;
      const organizeButton = document.getElementById("organize");
      const organizationPanel = document.getElementById("organization");
      const organizationStatus = document.getElementById("organization-status");
      let organization = null;
      let originalInput = null;
      let organizeRequest = 0;
      let organizing = false;
      let captureAnchor = null;
      let activeCandidate = 0;
      let submission = null;
      let saving = false;
      let resumeFocus = null;
      let themesInitialized = false;
      let savedSource = null;
      let feedbackTimeout = null;
      const savedSourceZone = document.getElementById("saved-source-zone");
      const candidateRow = document.getElementById("candidate-row");
      const candidateSelect = document.getElementById("candidate-select");
      const candidateRemove = document.getElementById("candidate-remove");
      const editorFields = [input, themeSelect, ...organizationPanel.querySelectorAll("input, select, textarea")];

      function updateOrganizationControls() {
        const count = organization?.tasks.length ?? 0;
        const locked = saving || submission !== null;
        candidateRow.hidden = !organization || count === 0;
        candidateSelect.hidden = count < 2;
        candidateRemove.disabled = locked;
        candidateSelect.disabled = locked;
        document.getElementById("organization-restore").disabled = locked;
        document.getElementById("organization-empty").hidden = !organization || count > 0;
        for (const field of editorFields) field.disabled = locked || Boolean(organization && count === 0);
        for (const field of organizationPanel.querySelectorAll(".organization-dates, label")) field.hidden = count === 0;
        input.hidden = Boolean(organization && count === 0);
        themeRow.classList.toggle("is-visible", mode !== "micro-memo" && (!organization || count > 0));
        if (organization) {
          submitButton.textContent = submission ? `${count}件の保存を再確認` : `${count}件を追加`;
          hint.textContent = count ? "案ごとに内容を確認 / Ctrl+Enter でまとめて追加 / Escで閉じる" : "候補0件 / 原文は保持 / Escで閉じる";
        }
        submitButton.disabled = organizing || saving || Boolean(organization && count === 0);
        if (mode === "saved-capture") {
          input.readOnly = !organization;
          submitButton.disabled ||= !organization;
          submitButton.hidden = !organization;
          savedSourceZone.disabled = organizing || Boolean(organization) || locked;
          themeSelect.disabled ||= !organization;
          organizeButton.disabled = !savedSource?.canOrganize;
          document.getElementById("organization-empty").textContent = "Task候補はありません。原文はそのまま残っています。";
        } else { input.readOnly = false; submitButton.hidden = false; organizeButton.disabled = false; }
      }

      function retainCandidate() {
        if (!organization?.tasks.length || submission) return true;
        const invalid = [...organizationPanel.querySelectorAll("input")].find((field) => !field.validity.valid);
        if (invalid) {
          organizationStatus.textContent = "日付・時刻・所要時間を確認してください。所要時間は1〜10080分の整数で入力できます。";
          invalid.reportValidity();
          invalid.focus();
          return false;
        }
        organization.tasks[activeCandidate] = { ...organization.tasks[activeCandidate], title: input.value.trim(), themeId: themeSelect.value || null,
          startDate: document.getElementById("organization-start").value || null,
          endDate: document.getElementById("organization-end").value || null,
          plannedStartTime: document.getElementById("organization-time").value || null,
          plannedDurationMinutes: document.getElementById("organization-duration").value === "" ? null : Number(document.getElementById("organization-duration").value),
          rangeSemantics: document.getElementById("organization-range").value || null,
          checklist: document.getElementById("organization-checklist").value.split("\n").map((item) => item.trim()).filter(Boolean),
          supplement: document.getElementById("organization-supplement").value };
        return true;
      }

      function showCandidate() {
        candidateSelect.replaceChildren();
        organization.tasks.forEach((task, index) => {
          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = `${index + 1}/${organization.tasks.length} ${task.title || "（タイトル未入力）"}`;
          candidateSelect.append(option);
        });
        candidateSelect.value = String(activeCandidate);
        const task = organization.tasks[activeCandidate];
        if (task) {
          input.value = task.title;
          themeSelect.value = task.themeId || "";
          document.getElementById("organization-start").value = task.startDate || "";
          document.getElementById("organization-end").value = task.endDate || "";
          document.getElementById("organization-time").value = task.plannedStartTime || "";
          document.getElementById("organization-duration").value = task.plannedDurationMinutes ?? "";
          document.getElementById("organization-range").value = task.rangeSemantics || "";
          document.getElementById("organization-checklist").value = task.checklist.join("\n");
          document.getElementById("organization-supplement").value = task.supplement;
        }
        document.getElementById("organization-warnings").textContent = [...new Set([...organization.warnings, ...(task?.warnings ?? [])])].join("\n");
        updateOrganizationControls();
      }

      function stopOrganizing() {
        ++organizeRequest;
        organizing = false;
        organizeButton.textContent = mode === "saved-capture" ? "AIへ送って整理" : "AIで整理";
        updateOrganizationControls();
      }
      function clearOrganization(restore = false) {
        stopOrganizing();
        if (restore && originalInput) { input.value = originalInput.text; themeSelect.value = originalInput.themeId; }
        organization = null;
        submission = null;
        resumeFocus = null;
        originalInput = null;
        organizationPanel.hidden = true;
        organizationStatus.textContent = "";
        organizeButton.hidden = !["today-task", "saved-capture"].includes(mode);
        applyMode(mode);
        updateOrganizationControls();
        window.captureApi.resize(false);
        void refreshDuePreview();
      }
      async function organize() {
        if (organizing) { stopOrganizing(); organizationStatus.textContent = "整理を中止しました。入力は残っています。"; return; }
        if (!["today-task", "saved-capture"].includes(mode) || !input.value.trim() || submission || saving) return;
        if (mode === "saved-capture" && !savedSourceZone.value.trim()) { organizationStatus.textContent = "入力時のタイムゾーンは未記録です。指定してから送信してください。"; savedSourceZone.focus(); return; }
        const snapshot = { text: input.value, themeId: themeSelect.value };
        const request = ++organizeRequest;
        organizing = true;
        organizeButton.textContent = "整理を中止";
        submitButton.disabled = true;
        organizationStatus.textContent = "AIで整理しています…";
        try {
          const result = await window.captureApi.organize(mode === "saved-capture"
            ? { captureId: savedSource.id, captureVersion: savedSource.version, timeZone: savedSourceZone.value.trim() }
            : { text: snapshot.text, themeId: snapshot.themeId || null,
              ...(captureAnchor ??= { capturedAt: new Date().toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }) });
          if (request !== organizeRequest || !["today-task", "saved-capture"].includes(mode) || input.value !== snapshot.text || themeSelect.value !== snapshot.themeId) return;
          originalInput = snapshot;
          organization = result;
          activeCandidate = 0;
          showCandidate();
          document.getElementById("original-text").textContent = snapshot.text;
          organizationPanel.hidden = false;
          organizeButton.hidden = true;
          duePreview.className = "due-preview";
          rangeChoice.hidden = true;
          organizationStatus.textContent = result.tasks.length ? "整理案を確認し、不要な案を除外して追加してください。" : "明示された次の行動はありません。原文は保持しています。";
          window.captureApi.resize(true);
        } catch {
          if (request === organizeRequest) organizationStatus.textContent = "整理できませんでした。設定・接続を確認して再試行してください。入力は残っています。";
        } finally {
          if (request === organizeRequest) stopOrganizing();
        }
      }

      function applyThemes(themes) {
        const current = themesInitialized ? themeSelect.value : lastThemeId;
        themesInitialized = true;
        themeSelect.innerHTML = '<option value="">個人業務 / Themeなし</option>';
        const orderedThemes = [...(themes || [])];
        const recentIndex = orderedThemes.findIndex((theme) => theme.id === lastThemeId);
        if (recentIndex > 0) {
          const [recent] = orderedThemes.splice(recentIndex, 1);
          orderedThemes.unshift(recent);
        }
        for (const theme of orderedThemes) {
          const option = document.createElement("option");
          option.value = theme.id;
          option.textContent = theme.id === lastThemeId ? `${theme.name}（最近）` : theme.name;
          themeSelect.append(option);
        }
        themeSelect.value = [...themeSelect.options].some((option) => option.value === current) ? current : "";
      }

      const MODES = new Set(["today-task", "micro-memo", "done-task", "saved-capture"]);

      function applyMode(nextMode) {
        mode = MODES.has(nextMode) ? nextMode : "inbox";
        const isTodayTask = mode === "today-task";
        const isMicroMemo = mode === "micro-memo";
        const isDoneTask = mode === "done-task";
        const usesTheme = !isMicroMemo;
        title.textContent = isDoneTask ? "やったことを記録" : isTodayTask ? "タスクに追加" : isMicroMemo ? "付箋メモに記録" : "Inbox に記録";
        modePill.textContent = isDoneTask ? "Done Task" : isTodayTask ? "Task" : isMicroMemo ? "Micro Memo" : "Inbox";
        input.placeholder = isDoneTask
          ? "やったこと｜ひとこと"
          : isTodayTask ? "タスク名｜金曜まで（期限は省略可）" : isMicroMemo ? "タイトルなしの走り書き" : "メモ・気づき・あとで整理すること";
        hint.textContent = isDoneTask || isTodayTask
          ? "｜ の後ろが" + (isTodayTask ? "期限" : "ひとこと") + " / Ctrl+Enter で記録 / Escで閉じる"
          : "Ctrl+Enter で記録 / Shift追加で続ける / Escで閉じる";
        submitButton.textContent = isTodayTask ? "追加" : isDoneTask ? "完了で記録" : "記録する";
        feedback.textContent = isDoneTask ? "やったことを記録しました" : isTodayTask ? "タスクを追加しました" : isMicroMemo ? "付箋メモに記録しました" : "Inbox整理に記録しました";
        themeRow.classList.toggle("is-visible", usesTheme);
        duePreview.className = "due-preview";
        duePreview.textContent = isTodayTask ? "期限指定なし · 今日" : "";
        duePreview.classList.toggle("is-visible", isTodayTask);
        selectedRangeSemantics = "";
        rangeChoice.replaceChildren();
        rangeChoice.hidden = true;
        organizeButton.hidden = !(isTodayTask || mode === "saved-capture") || organization !== null;
        const isSaved = mode === "saved-capture";
        document.getElementById("saved-source").hidden = !isSaved;
        document.getElementById("saved-source-return").hidden = !isSaved;
        if (isSaved) {
          title.textContent = "保存したCaptureを整理";
          modePill.textContent = "Capture";
          hint.textContent = "選んだ候補だけ追加 / 原文はCaptureに保持";
          organizeButton.textContent = "AIへ送って整理";
          document.getElementById("saved-source-date").textContent = `元の入力日時: ${savedSource?.capturedAt || "不明"}`;
          document.getElementById("saved-source-policy").textContent = savedSource?.canOrganize
            ? "この原文・入力日時・タイムゾーンと、公開を許可した所属Theme名だけを設定済みAIへ送ります。"
            : "CaptureのAI公開範囲で「外部AI」を許可すると整理できます。";
        }
      }

      function renderRangeChoice(result) {
        rangeChoice.replaceChildren();
        if (result.state !== "ok" || result.kind !== "range" || !result.ambiguous) {
          rangeChoice.hidden = true;
          return;
        }
        rangeChoice.hidden = false;
        const label = document.createElement("span");
        label.textContent = "期間の意味:";
        rangeChoice.append(label);
        for (const option of [
          ["once_within_window", "期間内に一度"],
          ["ongoing", "期間中継続"],
        ]) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.rangeSemantics = option[0];
          button.textContent = option[1];
          button.classList.toggle("is-selected", selectedRangeSemantics === option[0]);
          button.addEventListener("click", () => {
            selectedRangeSemantics = option[0];
            for (const candidate of rangeChoice.querySelectorAll("button")) {
              candidate.classList.toggle("is-selected", candidate === button);
            }
          });
          rangeChoice.append(button);
        }
      }

      // 期限は解釈結果を保存前に見せる。読めない表現のまま黙って保存させない（#308）。
      async function refreshDuePreview() {
        if (mode !== "today-task" || organization) return;
        const request = ++previewRequest;
        const result = await window.captureApi.previewDue(input.value);
        if (mode !== "today-task" || organization || request !== previewRequest) return;
        if (result.state === "empty") {
          duePreview.className = "due-preview is-visible";
          duePreview.textContent = "期限指定なし · 今日";
          rangeChoice.hidden = true;
          return;
        }
        duePreview.className = result.state === "ok" ? "due-preview is-visible" : "due-preview is-visible is-error";
        if (result.state === "ok") {
          selectedRangeSemantics = result.rangeSemantics || "";
          duePreview.textContent = result.kind === "range" ? `日付範囲: ${result.label}` : `期限: ${result.label}`;
          renderRangeChoice(result);
        } else {
          duePreview.textContent = result.message;
          rangeChoice.hidden = true;
        }
      }

      async function submit(continueCapturing = false) {
        if (organizing || submitButton.disabled) return;
        const text = input.value.trim();
        if (!organization && !text) return;
        if (organization) {
          if (!organization.tasks.length || !retainCandidate()) return;
          if (!submission) {
            const invalidIndex = organization.tasks.findIndex((task) => !task.title || task.title.length > 500 || task.checklist.length > 20 || task.checklist.some((item) => item.length > 200) || task.supplement.length > 12000 || (task.startDate && task.endDate && task.endDate < task.startDate));
            if (invalidIndex >= 0) {
              activeCandidate = invalidIndex;
              showCandidate();
              organizationStatus.textContent = `${invalidIndex + 1}件目を確認してください。タイトルは1〜500文字、チェック項目は20件以内・各200文字以内、補足は12,000文字以内で、期限は開始日以降にしてください。`;
              input.focus();
              return;
            }
            submission = { ...structuredClone(organization), submissionId: crypto.randomUUID(), issuedAt: new Date().toISOString() };
            if (mode === "saved-capture") Object.assign(submission, { captureId: savedSource.id, captureVersion: savedSource.version });
          }
        }
        saving = true;
        updateOrganizationControls();
        try {
          const usesTheme = mode !== "micro-memo";
          const themeId = usesTheme ? themeSelect.value : "";
          const result = await window.captureApi.save(originalInput?.text ?? text, mode, themeId, selectedRangeSemantics || undefined, submission ?? undefined);
          if (organization && result?.status === "not_saved") {
            submission = null;
            organizationStatus.textContent = result.message || "内容を確認して再試行してください。入力は残っています。";
            return;
          }
          const savedCount = organization?.tasks.length;
          if (usesTheme) {
            lastThemeId = themeId;
            localStorage.setItem("tasken:quick-capture:last-theme-id", themeId);
          }
          input.value = mode === "saved-capture" ? savedSource.text : "";
          captureAnchor = null;
          clearOrganization();
          if (savedCount) feedback.textContent = `${savedCount}件のタスクを追加しました`;
          feedback.style.display = "";
          feedback.style.animation = "none";
          feedback.offsetHeight;
          feedback.style.animation = "";
          feedbackTimeout = setTimeout(() => {
            feedback.style.display = "none";
            if (continueCapturing) {
              input.focus();
            } else {
              window.captureApi.hide();
            }
          }, 600);
        } catch (error) {
          // 期限を読み取れない等、直せる失敗は原因をそのまま見せる。入力は消さない。
          const reason = String(error?.message || "").replace(/^Error: /, "").replace(/^.*Error invoking remote method '[^']*': Error: /, "");
          if (organization) {
            organizationStatus.textContent = "保存結果を確認できませんでした。元の入力と整理案は残っています。「保存を再確認」で同じ内容を再送できます。確認が終わるまで編集はできません。";
            return;
          }
          feedback.textContent = reason
            ? `${reason} 入力は残っています。`
            : "保存できませんでした。入力は残っています。メイン画面を開いて状態を確認してください。";
          feedback.classList.add("error");
          feedback.style.display = "";
        } finally {
          saving = false;
          updateOrganizationControls();
        }
      }

      submitButton.addEventListener("click", () => submit(false));
      input.addEventListener("input", () => {
        if (!organization) {
          if (input.value && !captureAnchor) captureAnchor = { capturedAt: new Date().toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone };
          else if (!input.value) captureAnchor = null;
        }
        if (organizing) { stopOrganizing(); organizationStatus.textContent = "入力が変わったため整理を中止しました。"; }
        void refreshDuePreview();
      });
      themeSelect.addEventListener("change", () => { if (organizing) { stopOrganizing(); organizationStatus.textContent = "Themeが変わったため整理を中止しました。"; } });
      candidateSelect.addEventListener("change", () => {
        const next = Number(candidateSelect.value);
        if (!retainCandidate()) { candidateSelect.value = String(activeCandidate); return; }
        activeCandidate = next;
        showCandidate();
      });
      candidateRemove.addEventListener("click", () => {
        if (submission || saving) return;
        organization.tasks.splice(activeCandidate, 1);
        activeCandidate = Math.min(activeCandidate, Math.max(0, organization.tasks.length - 1));
        showCandidate();
        organizationStatus.textContent = organization.tasks.length ? `${organization.tasks.length}件を追加できます。` : "すべての案を除外しました。";
        if (organization.tasks.length > 1) candidateSelect.focus();
        else if (organization.tasks.length) input.focus();
        else document.getElementById("organization-restore").focus();
      });
      organizeButton.addEventListener("click", organize);
      document.getElementById("saved-source-return").addEventListener("click", () => { stopOrganizing(); window.captureApi.hide(); });
      document.getElementById("organization-restore").addEventListener("click", () => { if (!submission && !saving) { clearOrganization(true); input.focus(); } });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          stopOrganizing();
          window.captureApi.hide();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
          event.preventDefault();
          submit(event.shiftKey);
        }
      });

      window.captureApi.onShow((nextMode, source) => {
        clearTimeout(feedbackTimeout);
        stopOrganizing();
        if (submission || saving) nextMode = mode;
        if (source && !submission && !saving && (!savedSource || source.id !== savedSource.id || source.version !== savedSource.version)) {
          clearOrganization();
          savedSource = source;
          input.value = source.text;
          savedSourceZone.value = source.timeZone;
          themeSelect.value = source.themeId || "";
        }
        if (source && savedSource?.id === source.id && !submission && !saving) savedSource.canOrganize = source.canOrganize;
        if (nextMode !== mode) { clearOrganization(true); }
        applyMode(nextMode);
        updateOrganizationControls();
        if (organization) { duePreview.className = "due-preview"; rangeChoice.hidden = true; }
        if (organization && resumeFocus && !resumeFocus.disabled && !resumeFocus.hidden) resumeFocus.focus({ preventScroll: true });
        else input.focus({ preventScroll: true });
        feedback.style.display = "none";
        feedback.classList.remove("error");
        const theme = document.documentElement.dataset.theme;
        if (!theme) document.documentElement.dataset.theme = "light";
      });

      window.captureApi.onHide(() => {
        resumeFocus = document.activeElement;
        if (organizing) organizationStatus.textContent = "整理を中止しました。入力は残っています。";
        stopOrganizing();
      });

      window.captureApi.onThemeChange((mode) => {
        document.documentElement.dataset.theme = mode;
      });
      window.captureApi.onThemes((themes) => {
        applyThemes(themes);
      });
      applyMode("inbox");
    </script>
  </body>
</html>
