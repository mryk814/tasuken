<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>付箋メモ</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: var(--color-surface);
        color: var(--color-text);
        font-family: var(--font-base);
        font-size: 13px;
      }
      button, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, textarea:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
      .sticky {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background: linear-gradient(180deg, var(--color-accent-subtle-bg-strong) 0%, var(--color-surface) 26%);
      }
      header {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3);
        -webkit-app-region: drag;
      }
      header .title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--color-text-secondary);
        font-size: 12px;
        font-weight: 700;
      }
      header button { -webkit-app-region: no-drag; }
      .icon-button {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-text-secondary);
      }
      .icon-button:hover { border-color: var(--color-border); background: var(--color-surface-subtle); color: var(--color-accent); }
      .icon-button.is-active { border-color: var(--color-accent); color: var(--color-accent); }
      .icon-button.danger:hover { color: var(--color-danger); }
      .icon-button svg {
        width: 15px; height: 15px;
        stroke: currentColor; stroke-width: 2; fill: none;
        stroke-linecap: round; stroke-linejoin: round;
      }
      textarea {
        width: 100%;
        height: 100%;
        min-height: 0;
        padding: 0 var(--space-3);
        border: 0;
        background: transparent;
        resize: none;
        line-height: 1.7;
        -webkit-app-region: no-drag;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: var(--space-1) var(--space-3) var(--space-2);
        color: var(--color-text-secondary);
        font-size: 11px;
        -webkit-app-region: drag;
      }
      .menu-anchor { position: relative; display: inline-flex; -webkit-app-region: no-drag; }
      .menu {
        position: absolute; top: calc(100% + 2px); right: 0; z-index: 10;
        min-width: 128px; display: grid; gap: 2px; padding: var(--space-1);
        border: 1px solid var(--color-border); border-radius: var(--radius-md);
        background: var(--color-surface); box-shadow: var(--shadow-lg);
      }
      .menu[hidden] { display: none; }
      .menu button {
        min-height: 28px; padding: 0 var(--space-2);
        border: 0; border-radius: var(--radius-sm);
        background: transparent; text-align: left; white-space: nowrap;
      }
      .menu button:hover { background: var(--color-surface-subtle); }
      .menu button.danger { color: var(--color-danger); }
      footer .state { font-variant-numeric: tabular-nums; }
      footer .state.is-error { color: var(--color-danger); font-weight: 700; }
      footer .conflict-action { -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--color-accent); text-decoration: underline; }
      footer a { -webkit-app-region: no-drag; color: var(--color-accent); }
      .link-row { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <div class="sticky">
      <header>
        <span class="title" id="title">付箋メモ</span>
        <button class="icon-button" id="pin" type="button" title="常に手前に表示" aria-label="常に手前に表示" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z" /><path d="M12 15v5" /></svg>
        </button>
        <button class="icon-button" id="copy" type="button" title="全文をコピー" aria-label="全文をコピー">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>
        </button>
        <button class="icon-button" id="open-main" type="button" title="Taskenで開く" aria-label="Taskenで開く">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6" /><path d="M20 4 10 14" /><path d="M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6" /></svg>
        </button>
        <span class="menu-anchor">
          <button class="icon-button" id="menu" type="button" title="メモの操作" aria-label="メモの操作" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="12" cy="19" r="1" /></svg>
          </button>
          <!-- 付箋を閉じることと、Memo自体のアーカイブ・削除を混同させない（#298）。 -->
          <span class="menu" id="menu-panel" role="menu" aria-label="メモの操作" hidden>
            <button type="button" role="menuitem" id="archive">アーカイブ</button>
            <button type="button" role="menuitem" id="delete" class="danger">メモを削除</button>
          </span>
        </span>
        <button class="icon-button" id="close" type="button" title="付箋を閉じる（メモは残ります）" aria-label="付箋を閉じる。メモは残ります">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </header>
      <textarea id="text" aria-label="付箋メモの内容" spellcheck="false" disabled></textarea>
      <footer>
        <span class="state" id="state">読み込み中</span>
        <button class="conflict-action" id="overwrite-conflict" type="button" hidden>この入力で保存</button>
        <span class="link-row" id="link-row"></span>
      </footer>
    </div>
    <script type="module">
      import {
        createMemoStickyAutosaveCoordinator,
        replaceTextareaValuePreservingSelection,
      } from "./src/features/memo-sticky/lib/memoStickyAutosaveCoordinator";

      const api = window.memoStickyApi;
      const titleEl = document.querySelector("#title");
      const textEl = document.querySelector("#text");
      const stateEl = document.querySelector("#state");
      const linkRow = document.querySelector("#link-row");
      const pinButton = document.querySelector("#pin");
      const overwriteConflictButton = document.querySelector("#overwrite-conflict");

      const AUTOSAVE_DELAY_MS = 600;
      let saveTimer = null;
      let initialized = false;

      function setState(message, tone = "") {
        stateEl.textContent = message;
        stateEl.className = `state ${tone}`;
      }

      function renderLink(url) {
        linkRow.textContent = "";
        if (!url) return;
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.textContent = "リンクを開く";
        anchor.rel = "noreferrer";
        linkRow.append(anchor);
      }

      function renderContent(content, preserveCaret = false) {
        if (!content) {
          setState("メモが見つかりません", "is-error");
          textEl.disabled = true;
          return;
        }
        textEl.disabled = false;
        titleEl.textContent = content.title || content.text.split(/\r?\n/, 1)[0] || "付箋メモ";
        if (preserveCaret) replaceTextareaValuePreservingSelection(textEl, content.text);
        else textEl.value = content.text;
        renderLink(content.url);
      }

      const coordinator = createMemoStickyAutosaveCoordinator({
        save: (request) => api.save(request),
        createRequestId: () => crypto.randomUUID(),
        onStateChange(state) {
          overwriteConflictButton.hidden = !state.conflict;
          const latest = coordinator.getContent();
          if (latest) {
            titleEl.textContent = latest.title || latest.text.split(/\r?\n/, 1)[0] || "付箋メモ";
            renderLink(latest.url);
          }
          if (state.conflict) {
            setState("本体側に新しい変更があります。入力内容はこの付箋に残っています", "is-error");
          } else if (state.error) {
            setState(`保存できません: ${state.error instanceof Error ? state.error.message : String(state.error)}`, "is-error");
          } else if (state.saving) {
            setState("保存中…");
          } else if (state.dirty) {
            setState("編集中");
          } else {
            setState("保存済み");
          }
        },
      });

      overwriteConflictButton.addEventListener("click", async () => {
        overwriteConflictButton.disabled = true;
        try {
          await coordinator.overwriteConflict();
        } finally {
          overwriteConflictButton.disabled = false;
        }
      });

      function workspaceContent(change) {
        const current = coordinator.getContent();
        if (!current || !change) return null;
        const candidates = [
          ...(change.type && change.entity ? [{ type: change.type, entity: change.entity }] : []),
          ...(Array.isArray(change.entities) ? change.entities : []),
        ];
        const match = candidates.find(({ type, entity }) => type === "capture_entry" && entity?.id === current.id);
        if (!match) return null;
        const entity = match.entity;
        return {
          id: String(entity.id),
          title: typeof entity.title === "string" ? entity.title : "",
          text: typeof entity.text === "string" ? entity.text : "",
          url: typeof entity.url === "string" ? entity.url : "",
          capturedAt: String(entity.captured_at || ""),
          version: Number(entity.version || 0),
        };
      }

      async function load(source) {
        try {
          const content = await api.load();
          if (!content) {
            renderContent(null);
            return;
          }
          if (!initialized) {
            coordinator.initialize(content);
            initialized = true;
            renderContent(content);
            return;
          }
          const decision = coordinator.receiveWorkspaceChange(content, source);
          if (decision === "applied") renderContent(content, true);
        } catch (error) {
          setState(error instanceof Error ? error.message : String(error), "is-error");
        }
      }

      async function requestSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = null;
        try {
          return await coordinator.requestSave();
        } catch {
          return false;
        }
      }

      textEl.addEventListener("input", () => {
        coordinator.edit(textEl.value);
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => { saveTimer = null; void requestSave(); }, AUTOSAVE_DELAY_MS);
      });

      // blurは保存を始めるだけで、再focus後の入力はrevision付きlatestとして残す。
      window.addEventListener("blur", () => { void requestSave(); });

      api.onAppFlushRequested(async ({ requestId }) => {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = null;
        const ok = await coordinator.flush();
        await api.ackAppFlush(requestId, ok);
      });

      document.querySelector("#copy").addEventListener("click", async () => {
        if (!await coordinator.flush()) return;
        const copied = await api.copy();
        setState(copied ? "コピーしました" : "コピーできません", copied ? "" : "is-error");
      });
      document.querySelector("#open-main").addEventListener("click", () => { void api.openInMain(); });
      // Main側のclose handshakeがflush ackを待ち、失敗・競合時は閉じない。
      document.querySelector("#close").addEventListener("click", () => { void api.close(); });
      pinButton.addEventListener("click", async () => {
        const next = pinButton.getAttribute("aria-pressed") !== "true";
        const applied = await api.setAlwaysOnTop(next);
        pinButton.setAttribute("aria-pressed", String(applied));
        pinButton.classList.toggle("is-active", applied);
      });

      const menuButton = document.querySelector("#menu");
      const menuPanel = document.querySelector("#menu-panel");

      function setMenuOpen(open) {
        menuPanel.hidden = !open;
        menuButton.setAttribute("aria-expanded", String(open));
      }

      menuButton.addEventListener("click", () => setMenuOpen(menuPanel.hidden));
      document.addEventListener("pointerdown", (event) => {
        if (!event.target.closest(".menu-anchor")) setMenuOpen(false);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setMenuOpen(false);
      });
      document.querySelector("#archive").addEventListener("click", async () => {
        setMenuOpen(false);
        if (!await coordinator.flush()) return;
        const done = await api.archive();
        if (!done) setState("アーカイブできません", "is-error");
      });
      document.querySelector("#delete").addEventListener("click", async () => {
        setMenuOpen(false);
        // 付箋を閉じるのと違い、削除は取り消しの効かない位置にあるので確認する。
        if (!window.confirm("このメモを削除しますか。付箋を閉じるだけならウィンドウの×を使ってください。")) return;
        const done = await api.remove();
        if (!done) setState("削除できません", "is-error");
      });

      // Escでは閉じない。付箋は開いたまま参照する用途なので、閉じるのは明示操作だけにする。
      api.onWorkspaceChanged((change) => {
        const content = workspaceContent(change);
        if (!content) {
          // Shared syncなどpayloadなしの変更だけ正本を読み直す。
          if (!change) void load();
          return;
        }
        const decision = coordinator.receiveWorkspaceChange(content, change.memoStickySave);
        if (decision === "applied") renderContent(content, true);
      });
      void (async () => {
        const pinned = await api.isAlwaysOnTop();
        pinButton.setAttribute("aria-pressed", String(pinned));
        pinButton.classList.toggle("is-active", pinned);
        await load();
        textEl.focus();
      })();
    </script>
  </body>
</html>
