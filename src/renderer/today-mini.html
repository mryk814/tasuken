<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今日やること</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-width: 300px;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(180deg, var(--color-accent) 0%, var(--color-accent-subtle-bg-strong) 58%, var(--color-bg) 100%);
        color: var(--color-text);
        font-family: var(--font-base);
        font-size: 13px;
      }
      button, input {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--color-on-accent); outline-offset: 2px; }
      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 22px 18px 14px;
        -webkit-app-region: drag;
      }
      button, input, main, .add-task-bar { -webkit-app-region: no-drag; }
      .mini-hero {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: var(--space-3);
        color: var(--color-on-accent);
      }
      h1 {
        margin: 0 0 var(--space-1);
        font-size: 24px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: 0;
      }
      .today-date {
        color: color-mix(in srgb, var(--color-on-accent) 82%, transparent);
        font-size: 14px;
        font-weight: 700;
      }
      .count {
        margin-top: var(--space-1);
        color: color-mix(in srgb, var(--color-on-accent) 82%, transparent);
        font: 12px var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .hero-actions {
        display: flex;
        gap: var(--space-2);
      }
      .icon-button {
        width: 32px;
        min-height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--color-text) 46%, transparent);
        color: var(--color-on-accent);
        padding: 0;
      }
      .icon-button:hover { background: color-mix(in srgb, var(--color-text) 58%, transparent); }
      .icon-button svg {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      main {
        min-height: 0;
        overflow-y: auto;
        padding: 28px 0 var(--space-3);
      }
      .state {
        display: grid;
        gap: var(--space-2);
        align-content: center;
        min-height: 180px;
        padding: var(--space-4);
        border: 1px dashed color-mix(in srgb, var(--color-on-accent) 52%, transparent);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--color-on-accent) 18%, transparent);
        color: color-mix(in srgb, var(--color-on-accent) 82%, transparent);
        text-align: center;
      }
      .state strong { color: var(--color-on-accent); }
      .state.is-error { border-color: var(--color-danger); color: var(--color-danger); }
      .task-list {
        display: grid;
        gap: var(--space-2);
      }
      .task-row {
        --theme-color: var(--color-chart-6);
        display: grid;
        grid-template-columns: 5px 30px minmax(0, 1fr) 30px;
        gap: var(--space-2);
        align-items: center;
        min-height: 56px;
        padding: 9px 10px 9px 0;
        border: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--color-surface) 88%, transparent);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      .task-row.is-high { background: color-mix(in srgb, var(--color-surface) 96%, transparent); }
      .theme-dot {
        align-self: stretch;
        width: 5px;
        border-radius: var(--radius-md) 0 0 var(--radius-md);
        background: var(--theme-color);
      }
      .check-button {
        width: 24px;
        height: 24px;
        min-height: 24px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 2px solid color-mix(in srgb, var(--color-text) 30%, transparent);
        border-radius: 999px;
        background: transparent;
        color: transparent;
      }
      .check-button:hover { border-color: var(--color-success); color: var(--color-success); }
      .task-main {
        min-width: 0;
        display: grid;
        gap: 2px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--color-text);
        text-align: left;
      }
      .task-main:hover .task-title { color: var(--color-accent); }
      .task-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 800;
      }
      .task-meta {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        min-width: 0;
        overflow: hidden;
        color: var(--color-text-secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .task-meta span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .reminder-clock {
        display: inline-grid;
        place-items: center;
        width: 14px;
        min-width: 14px;
        color: var(--color-accent);
      }
      .reminder-clock svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .open-button {
        width: 28px;
        min-height: 28px;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--color-text) 14%, transparent);
        border-radius: var(--radius-md);
        background: color-mix(in srgb, var(--color-surface) 72%, transparent);
        color: var(--color-accent);
        font-weight: 800;
      }
      .open-button:hover { background: var(--color-surface); }
      .add-task-bar {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        gap: var(--space-2);
        min-height: 48px;
        padding: 8px 12px;
        border: 1px solid color-mix(in srgb, var(--color-on-accent) 20%, transparent);
        border-radius: var(--radius-sm);
        background: color-mix(in srgb, var(--color-text) 46%, transparent);
        color: var(--color-on-accent);
      }
      .add-task-bar:hover { background: color-mix(in srgb, var(--color-text) 58%, transparent); }
      .add-icon {
        width: 22px;
        height: 22px;
        border: 2px solid color-mix(in srgb, var(--color-on-accent) 88%, transparent);
        border-radius: 999px;
      }
      .add-input {
        width: 100%;
        min-height: 30px;
        border: 0;
        background: transparent;
        color: var(--color-on-accent);
        outline: none;
      }
      .add-input::placeholder { color: color-mix(in srgb, var(--color-on-accent) 88%, transparent); }
      .add-input:disabled { opacity: .62; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="mini-hero">
        <div>
          <h1>今日やること</h1>
          <div class="today-date" id="today-date"></div>
          <div class="count" id="count">--</div>
        </div>
        <div class="hero-actions">
          <button class="icon-button" id="pin-top-right" type="button" title="画面右上へ移動" aria-label="画面右上へ移動">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v10" /><path d="M19 5l-9 9" /><path d="M5 9v10h10" /></svg>
          </button>
          <button class="icon-button" id="refresh" type="button" title="更新" aria-label="更新">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7" /><path d="M20 5v6h-6" /></svg>
          </button>
          <button class="icon-button" id="close-window" type="button" title="閉じる" aria-label="閉じる">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>
      </header>
      <main id="content">
        <div class="state"><strong>読み込み中</strong><span>今日のタスクを確認しています。</span></div>
      </main>
      <form class="add-task-bar" id="add-task-form">
        <span class="add-icon" aria-hidden="true"></span>
        <input class="add-input" id="add-task-input" autocomplete="off" placeholder="タスクの追加" aria-label="タスクの追加" />
      </form>
    </div>
    <script type="module">
      const content = document.querySelector("#content");
      const count = document.querySelector("#count");
      const todayDate = document.querySelector("#today-date");
      const refreshButton = document.querySelector("#refresh");
      const pinTopRightButton = document.querySelector("#pin-top-right");
      const closeWindowButton = document.querySelector("#close-window");
      const addTaskForm = document.querySelector("#add-task-form");
      const addTaskInput = document.querySelector("#add-task-input");

      // 日付は起動時に固定せず、日付をまたいでも表示が古くならないよう都度更新する。
      const dateFormat = new Intl.DateTimeFormat("ja-JP", { month: "long", day: "numeric", weekday: "short" });
      let todayKey = "";

      function applyToday() {
        const now = new Date();
        const key = localDateKey(now);
        const changed = key !== todayKey;
        todayKey = key;
        if (changed) todayDate.textContent = dateFormat.format(now);
        return changed;
      }

      applyToday();

      function localDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function stateHtml(title, body, tone = "") {
        return `<div class="state ${tone}"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(body)}</span></div>`;
      }

      function scheduleHint(task) {
        return task.scheduleLabel && task.scheduleLabel !== todayKey ? task.scheduleLabel : "";
      }

      function rowHtml(task) {
        const schedule = scheduleHint(task);
        const scheduleMeta = schedule ? `<span class="num">${escapeHtml(schedule)}</span>` : "";
        const reminder = task.hasReminder
          ? `<span class="reminder-clock" title="リマインダーあり" aria-label="リマインダーあり"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2" /><path d="M20 12a8 8 0 1 1-2.3-5.7" /><path d="M18 2v5h-5" /></svg></span>`
          : "";
        const checklist = task.checklistTotal > 0
          ? `<span class="num">${task.checklistDone}/${task.checklistTotal}</span>`
          : "";
        return `
          <article class="task-row ${task.priority === "high" ? "is-high" : ""}" data-task-id="${escapeHtml(task.id)}" style="--theme-color: ${escapeHtml(task.themeColor || "var(--color-chart-6)")}">
            <span class="theme-dot" aria-hidden="true"></span>
            <button class="check-button" type="button" data-action="toggle" aria-label="${escapeHtml(task.title)}を完了">✓</button>
            <button class="task-main" type="button" data-action="open" title="Taskenで開く">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <span class="task-meta">
                <span>${escapeHtml(task.themeName)}</span>
                ${scheduleMeta}
                ${reminder}
                ${checklist}
              </span>
            </button>
            <button class="open-button" type="button" data-action="open" aria-label="${escapeHtml(task.title)}をTaskenで開く">›</button>
          </article>
        `;
      }

      async function render(loader = window.todayMiniApi.list) {
        refreshButton.disabled = true;
        try {
          const tasks = await loader();
          count.textContent = `${tasks.length}件`;
          content.innerHTML = tasks.length
            ? `<div class="task-list">${tasks.map(rowHtml).join("")}</div>`
            : stateHtml("今日のタスクはありません", "下のバーから追加できます。");
        } catch (error) {
          count.textContent = "--";
          content.innerHTML = stateHtml("読み込めませんでした", error instanceof Error ? error.message : String(error), "is-error");
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", () => render(window.todayMiniApi.refresh));
      pinTopRightButton.addEventListener("click", () => window.todayMiniApi.pinTopRight());
      closeWindowButton.addEventListener("click", () => window.todayMiniApi.hide());
      addTaskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const title = addTaskInput.value.trim();
        if (!title) return;
        addTaskInput.disabled = true;
        try {
          await render(() => window.todayMiniApi.addTask(title));
          addTaskInput.value = "";
        } finally {
          addTaskInput.disabled = false;
          addTaskInput.focus();
        }
      });
      content.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        const row = button?.closest("[data-task-id]");
        if (!button || !row) return;
        const taskId = row.dataset.taskId;
        if (!taskId) return;
        if (button.dataset.action === "toggle") {
          await render(() => window.todayMiniApi.toggle(taskId));
          return;
        }
        await window.todayMiniApi.openTask(taskId);
      });
      // 変更通知が届かない経路（外部プロセスの書き込み・スリープ復帰・日付またぎ）でも
      // 表示が古いまま残らないよう、focus復帰・日付変更・定期確認を併用する。
      const CONSISTENCY_INTERVAL_MS = 60000;
      let syncing = false;

      async function syncNow() {
        if (syncing) return;
        syncing = true;
        try {
          applyToday();
          await render(window.todayMiniApi.refresh);
        } finally {
          syncing = false;
        }
      }

      window.todayMiniApi.onRefresh(() => { void syncNow(); });
      window.addEventListener("focus", () => { void syncNow(); });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") void syncNow();
      });
      setInterval(() => {
        const dayChanged = applyToday();
        if (dayChanged || document.visibilityState === "visible") void syncNow();
      }, CONSISTENCY_INTERVAL_MS);
      render();
    </script>
  </body>
</html>
