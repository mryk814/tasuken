# OpenAI Secure MCP Tunnel サイドカー（追加上書き用。通常のcomposeと重ねて使う）。
#
# 前提:
#   - .env に CONTROL_PLANE_TUNNEL_ID=tunnel_... を設定
#   - secrets/control_plane_api_key に Runtime API key を保存（chmod 600）
#   - Core（tasken-headless）が起動していること
#
# 起動:
#   sudo /var/packages/ContainerManager/target/usr/bin/docker-compose \
#     --env-file .env -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# Coreと同じネットワーク名前空間を共有し、read-only MCP bridge（stdio）を子プロセスとして
# 起動する。Tasken domain側にtransport固有logicは持ち込まない。
services:
  tunnel-client:
    image: tasken-headless:local
    container_name: tasken-tunnel
    network_mode: "service:tasken-headless"
    user: "${TASKEN_UID:-1000}:${TASKEN_GID:-1000}"
    group_add:
      - "${TASKEN_ADMIN_GID:-101}"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - tasken-headless
    environment:
      TASKEN_USER_DATA_DIR: /data
      TASKEN_MCP_READ_ONLY: "1"
      CONTROL_PLANE_TUNNEL_ID: "${CONTROL_PLANE_TUNNEL_ID:-}"
      MCP_COMMAND: "command=node /app/mcp-dist/server.mjs,channel=main"
      HEALTH_LISTEN_ADDR: "127.0.0.1:18080"
      LOG_FORMAT: "json"
      LOG_LEVEL: "info"
    entrypoint: ["/usr/local/bin/tunnel-client"]
    command:
      - run
      - --control-plane.api-key=file:/run/secrets/control_plane_api_key
    secrets:
      - control_plane_api_key
    volumes:
      - ./state:/data:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  control_plane_api_key:
    file: ./secrets/control_plane_api_key
