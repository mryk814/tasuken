# Synology Container Manager（Project / docker compose）向け
#
# 1. /volume1/tasken-sync を、データ端末と共有しているフォルダへ合わせる。
#    （Synology Drive や Cloud Sync で OneDrive/社内共有フォルダをNASへ同期した先）
# 2. tasken-data はNASローカルのvolume。SQLiteを同期フォルダへ置かない。
# 3. 起動前にデータ端末側で共有フォルダ同期を設定し、差分が公開されていること。
# 4. 必ずUID/GIDを揃える（deploy/synology/README を参照）。二重writerにしない。
services:
  tasken-headless:
    build:
      context: ../..
      dockerfile: deploy/synology/Dockerfile
    image: tasken-headless:local
    container_name: tasken-headless
    user: "${TASKEN_UID:-1000}:${TASKEN_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TASKEN_USER_DATA_DIR: /data
    command:
      - --user-data-dir=/data
      - --sync-directory=/sync
    volumes:
      - tasken-data:/data
      - /volume1/tasken-sync:/sync
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  tasken-data:
