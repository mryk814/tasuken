name: Merge main into Android Theme branch

on:
  push:
    branches:
      - codex/400-android-theme
    paths:
      - .github/workflows/merge-main-android-theme.yml

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-theme
          fetch-depth: 0
      - name: Merge main and resolve the known independent host edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="src/main/gateway/mobile/mobileGatewayHost.ts"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours -- "$expected"
            python - <<'PY'
          from pathlib import Path
          path = Path("src/main/gateway/mobile/mobileGatewayHost.ts")
          text = path.read_text(encoding="utf-8")
          old = "pairedAt: result.device.createdAt,"
          new = "pairedAt: result.device.updatedAt,"
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one pairing timestamp occurrence, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
            git add "$expected"
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          rm .github/workflows/merge-main-android-theme.yml
          git add -A
          git commit -m "chore: merge main into Android Theme work"
          git push origin HEAD:codex/400-android-theme
