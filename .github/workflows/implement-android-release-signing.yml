name: Implement Android release signing

on:
  push:
    branches:
      - codex/400-android-release-signing
    paths:
      - .github/workflows/implement-android-release-signing.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-release-signing
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure secret-free release signing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android-app/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          if not text.startswith('plugins {'):
              raise SystemExit("Unexpected app Gradle script header")
          prelude = '''import java.util.Properties

          val releaseSigningProperties = Properties()
          val releaseSigningPropertiesFile = rootProject.file("keystore.properties")
          if (releaseSigningPropertiesFile.isFile) {
              releaseSigningPropertiesFile.inputStream().use(releaseSigningProperties::load)
          }

          fun releaseSigningValue(propertyKey: String, environmentKey: String): String? =
              releaseSigningProperties.getProperty(propertyKey)?.trim()?.takeIf(String::isNotEmpty)
                  ?: providers.gradleProperty(environmentKey).orNull?.trim()?.takeIf(String::isNotEmpty)
                  ?: providers.environmentVariable(environmentKey).orNull?.trim()?.takeIf(String::isNotEmpty)

          val releaseStoreFilePath = releaseSigningValue("storeFile", "TASKEN_ANDROID_KEYSTORE")
          val releaseStorePassword = releaseSigningValue("storePassword", "TASKEN_ANDROID_KEYSTORE_PASSWORD")
          val releaseKeyAlias = releaseSigningValue("keyAlias", "TASKEN_ANDROID_KEY_ALIAS")
          val releaseKeyPassword = releaseSigningValue("keyPassword", "TASKEN_ANDROID_KEY_PASSWORD")
          val missingReleaseSigningValues = buildList {
              if (releaseStoreFilePath == null) add("TASKEN_ANDROID_KEYSTORE / storeFile")
              if (releaseStorePassword == null) add("TASKEN_ANDROID_KEYSTORE_PASSWORD / storePassword")
              if (releaseKeyAlias == null) add("TASKEN_ANDROID_KEY_ALIAS / keyAlias")
              if (releaseKeyPassword == null) add("TASKEN_ANDROID_KEY_PASSWORD / keyPassword")
          }
          val releaseSigningConfigured = missingReleaseSigningValues.isEmpty()
          val requireReleaseSigning: () -> Unit = {
              if (!releaseSigningConfigured) {
                  throw GradleException(
                      "Release signing is not configured. Missing: ${missingReleaseSigningValues.joinToString()}. " +
                          "Use environment variables, Gradle properties, or android-app/keystore.properties.",
                  )
              }
              val keystore = rootProject.file(requireNotNull(releaseStoreFilePath))
              if (!keystore.isFile) {
                  throw GradleException("Release keystore does not exist: ${keystore.absolutePath}")
              }
          }

          '''
          text = prelude + text

          marker = '''    defaultConfig {
                  applicationId = "jp.personal.tasken.companion"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

          '''
          replacement = marker + '''    signingConfigs {
                  if (releaseSigningConfigured) {
                      create("release") {
                          storeFile = rootProject.file(requireNotNull(releaseStoreFilePath))
                          storePassword = requireNotNull(releaseStorePassword)
                          keyAlias = requireNotNull(releaseKeyAlias)
                          keyPassword = requireNotNull(releaseKeyPassword)
                      }
                  }
              }

              buildTypes {
                  getByName("release") {
                      if (releaseSigningConfigured) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit("defaultConfig block changed unexpectedly")
          text = text.replace(marker, replacement)

          text += '''
          tasks.register("verifyReleaseSigning") {
              group = "verification"
              description = "Fails unless the Tasken Android release signing material is complete and readable."
              doLast { requireReleaseSigning() }
          }

          tasks.configureEach {
              val releasePackagingTask = name in setOf(
                  "assembleRelease",
                  "bundleRelease",
                  "packageRelease",
                  "signReleaseBundle",
              )
              if (releasePackagingTask) {
                  doFirst { requireReleaseSigning() }
              }
          }
          '''
          path.write_text(text, encoding="utf-8")

          ignore = Path(".gitignore")
          ignore_text = ignore.read_text(encoding="utf-8")
          addition = '''/android-app/keystore.properties
          /android-app/*.jks
          /android-app/*.keystore
          /android-app/*.p12
          '''
          if "/android-app/keystore.properties" not in ignore_text:
              anchor = "/android-app/local.properties\n"
              if anchor not in ignore_text:
                  raise SystemExit("Android ignore anchor changed unexpectedly")
              ignore_text = ignore_text.replace(anchor, anchor + addition)
          ignore.write_text(ignore_text, encoding="utf-8")
          PY

          cat > android-app/keystore.properties.example <<'PROPERTIES'
          # Copy to android-app/keystore.properties and keep the real file outside version control.
          storeFile=C:/Users/you/.tasken/tasken-release.jks
          storePassword=<set locally>
          keyAlias=tasken
          keyPassword=<set locally>
          PROPERTIES

          mkdir -p android-app/scripts
          cat > android-app/scripts/build-signed-release.ps1 <<'POWERSHELL'
          [CmdletBinding()]
          param(
              [string]$Keystore = $env:TASKEN_ANDROID_KEYSTORE,
              [string]$KeystorePassword = $env:TASKEN_ANDROID_KEYSTORE_PASSWORD,
              [string]$KeyAlias = $env:TASKEN_ANDROID_KEY_ALIAS,
              [string]$KeyPassword = $env:TASKEN_ANDROID_KEY_PASSWORD
          )

          $required = @{
              TASKEN_ANDROID_KEYSTORE = $Keystore
              TASKEN_ANDROID_KEYSTORE_PASSWORD = $KeystorePassword
              TASKEN_ANDROID_KEY_ALIAS = $KeyAlias
              TASKEN_ANDROID_KEY_PASSWORD = $KeyPassword
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
              throw "Release signing is not configured. Missing: $($missing -join ', ')"
          }
          if (-not (Test-Path -LiteralPath $Keystore -PathType Leaf)) {
              throw "Release keystore does not exist: $Keystore"
          }

          $env:TASKEN_ANDROID_KEYSTORE = (Resolve-Path -LiteralPath $Keystore).Path
          $env:TASKEN_ANDROID_KEYSTORE_PASSWORD = $KeystorePassword
          $env:TASKEN_ANDROID_KEY_ALIAS = $KeyAlias
          $env:TASKEN_ANDROID_KEY_PASSWORD = $KeyPassword

          $androidRoot = Split-Path -Parent $PSScriptRoot
          Push-Location $androidRoot
          try {
              & .\gradlew.bat --no-daemon verifyReleaseSigning assembleRelease
              if ($LASTEXITCODE -ne 0) { throw "Gradle release build failed with exit code $LASTEXITCODE" }

              $apk = Join-Path $androidRoot "app\build\outputs\apk\release\app-release.apk"
              if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) {
                  throw "Signed release APK was not produced: $apk"
              }

              $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
              if ($sdkRoot) {
                  $apksigner = Get-ChildItem -Path (Join-Path $sdkRoot "build-tools") -Filter "apksigner.bat" -Recurse -File |
                      Sort-Object FullName -Descending |
                      Select-Object -First 1
                  if ($apksigner) {
                      & $apksigner.FullName verify --verbose $apk
                      if ($LASTEXITCODE -ne 0) { throw "apksigner verification failed" }
                  }
              }

              Write-Output (Resolve-Path -LiteralPath $apk).Path
          }
          finally {
              Pop-Location
          }
          POWERSHELL

          cat > docs/android-release-signing.md <<'MARKDOWN'
          # Tasken Android release signing

          Date: 2026-08-22
          Parent: #400

          Tasken's release APK is never signed with committed credentials. Release signing can be supplied through either:

          1. environment variables;
          2. Gradle properties with the same names;
          3. an ignored `android-app/keystore.properties` file.

          Required values:

          | Environment / Gradle property | `keystore.properties` key |
          | --- | --- |
          | `TASKEN_ANDROID_KEYSTORE` | `storeFile` |
          | `TASKEN_ANDROID_KEYSTORE_PASSWORD` | `storePassword` |
          | `TASKEN_ANDROID_KEY_ALIAS` | `keyAlias` |
          | `TASKEN_ANDROID_KEY_PASSWORD` | `keyPassword` |

          ## Generate the long-lived key once

          On Windows PowerShell, create a private directory and let `keytool` prompt for secrets:

          ```powershell
          New-Item -ItemType Directory -Force "$HOME\.tasken" | Out-Null
          keytool -genkeypair -v `
            -keystore "$HOME\.tasken\tasken-release.jks" `
            -alias tasken `
            -keyalg RSA `
            -keysize 4096 `
            -validity 10000
          ```

          Keep at least two secure backups of the keystore and its passwords. The same key is required to install future release builds as updates over the existing app.

          ## Build on the local Windows machine

          Either copy `android-app/keystore.properties.example` to the ignored `android-app/keystore.properties` and fill it locally, or set the four environment variables. Then run:

          ```powershell
          .\android-app\scripts\build-signed-release.ps1
          ```

          The script builds and, when Android build-tools are available, verifies:

          ```text
          android-app/app/build/outputs/apk/release/app-release.apk
          ```

          `assembleRelease`, `bundleRelease`, and packaging tasks fail closed when signing material is incomplete. Debug builds remain unaffected.

          ## Independent CI proof

          The implementation workflow creates a throwaway CI keystore, proves that unsigned release packaging is rejected, builds a signed release APK, and verifies it with Android `apksigner`. The throwaway key is never used for the user's installable APK.

          Official guidance:

          - https://developer.android.com/build/build-variants#signing
          - https://developer.android.com/studio/publish/app-signing
          MARKDOWN
      - name: Verify debug builds remain independent of release secrets
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace
      - name: Prove unsigned release packaging fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          set +e
          ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/unsigned-release.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/unsigned-release.log"
            echo "assembleRelease unexpectedly succeeded without signing material"
            exit 1
          fi
          grep -F "Release signing is not configured" "$RUNNER_TEMP/unsigned-release.log"
      - name: Build and verify a signed release with an ephemeral CI key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/tasken-ci-release.jks" \
            -storepass tasken-ci-store-password \
            -alias tasken-ci \
            -keypass tasken-ci-key-password \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Tasken CI,OU=Verification,O=Tasken,L=Kobe,ST=Hyogo,C=JP"
          cd android-app
          TASKEN_ANDROID_KEYSTORE="$RUNNER_TEMP/tasken-ci-release.jks" \
          TASKEN_ANDROID_KEYSTORE_PASSWORD="tasken-ci-store-password" \
          TASKEN_ANDROID_KEY_ALIAS="tasken-ci" \
          TASKEN_ANDROID_KEY_PASSWORD="tasken-ci-key-password" \
            ./gradlew --no-daemon verifyReleaseSigning assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Commit the verified signing support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/implement-android-release-signing.yml
          git add -A
          git commit -m "build(android): add secure signed release APK workflow"
          git push origin HEAD:codex/400-android-release-signing
