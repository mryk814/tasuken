name: Implement Android release signing v2

on:
  push:
    branches:
      - codex/400-android-release-signing
    paths:
      - .github/workflows/implement-android-release-signing-v2.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-release-signing
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure secret-free release signing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android-app/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          if not text.startswith("plugins {"):
              raise SystemExit("Unexpected app Gradle script header")
          if "TASKEN_ANDROID_KEYSTORE" in text:
              raise SystemExit("Release signing support is already present")

          prelude = '''import java.util.Properties

          val taskenReleaseSigningProperties = Properties()
          val taskenReleaseSigningPropertiesFile = rootProject.file("keystore.properties")
          if (taskenReleaseSigningPropertiesFile.isFile) {
              taskenReleaseSigningPropertiesFile.inputStream().use(taskenReleaseSigningProperties::load)
          }

          fun taskenReleaseSigningValue(propertyKey: String, environmentKey: String): String? =
              taskenReleaseSigningProperties.getProperty(propertyKey)?.trim()?.takeIf { it.isNotEmpty() }
                  ?: providers.gradleProperty(environmentKey).orNull?.trim()?.takeIf { it.isNotEmpty() }
                  ?: providers.environmentVariable(environmentKey).orNull?.trim()?.takeIf { it.isNotEmpty() }

          val taskenReleaseStoreFilePath = taskenReleaseSigningValue("storeFile", "TASKEN_ANDROID_KEYSTORE")
          val taskenReleaseStorePassword = taskenReleaseSigningValue("storePassword", "TASKEN_ANDROID_KEYSTORE_PASSWORD")
          val taskenReleaseKeyAlias = taskenReleaseSigningValue("keyAlias", "TASKEN_ANDROID_KEY_ALIAS")
          val taskenReleaseKeyPassword = taskenReleaseSigningValue("keyPassword", "TASKEN_ANDROID_KEY_PASSWORD")
          val taskenMissingReleaseSigningValues = buildList {
              if (taskenReleaseStoreFilePath == null) add("TASKEN_ANDROID_KEYSTORE / storeFile")
              if (taskenReleaseStorePassword == null) add("TASKEN_ANDROID_KEYSTORE_PASSWORD / storePassword")
              if (taskenReleaseKeyAlias == null) add("TASKEN_ANDROID_KEY_ALIAS / keyAlias")
              if (taskenReleaseKeyPassword == null) add("TASKEN_ANDROID_KEY_PASSWORD / keyPassword")
          }
          val taskenReleaseSigningConfigured = taskenMissingReleaseSigningValues.isEmpty()
          val requireTaskenReleaseSigning: () -> Unit = {
              if (!taskenReleaseSigningConfigured) {
                  throw GradleException(
                      "Release signing is not configured. Missing: ${taskenMissingReleaseSigningValues.joinToString()}. " +
                          "Use environment variables, Gradle properties, or android-app/keystore.properties.",
                  )
              }
              val keystore = rootProject.file(requireNotNull(taskenReleaseStoreFilePath))
              if (!keystore.isFile) {
                  throw GradleException("Release keystore does not exist: ${keystore.absolutePath}")
              }
          }

          '''
          text = prelude + text

          marker = '''    defaultConfig {
                  applicationId = "jp.personal.tasken.companion"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "0.1.0"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

          '''
          signing = '''    signingConfigs {
                  if (taskenReleaseSigningConfigured) {
                      create("release") {
                          storeFile = rootProject.file(requireNotNull(taskenReleaseStoreFilePath))
                          storePassword = requireNotNull(taskenReleaseStorePassword)
                          keyAlias = requireNotNull(taskenReleaseKeyAlias)
                          keyPassword = requireNotNull(taskenReleaseKeyPassword)
                      }
                  }
              }

              buildTypes {
                  getByName("release") {
                      if (taskenReleaseSigningConfigured) {
                          signingConfig = signingConfigs.getByName("release")
                      }
                  }
              }

          '''
          if text.count(marker) != 1:
              raise SystemExit("defaultConfig block changed unexpectedly")
          text = text.replace(marker, marker + signing)

          text += '''
          val taskenReleasePackagingTasks = setOf(
              "assemblerelease",
              "bundlerelease",
              "installrelease",
              "packagerelease",
              "publishreleasebundle",
              "signreleasebundle",
          )
          if (gradle.startParameter.taskNames.any {
                  it.substringAfterLast(':').lowercase() in taskenReleasePackagingTasks
              }
          ) {
              requireTaskenReleaseSigning()
          }

          tasks.register("verifyReleaseSigning") {
              group = "verification"
              description = "Fails unless Tasken Android release signing material is complete and readable."
              doLast { requireTaskenReleaseSigning() }
          }
          '''
          path.write_text(text, encoding="utf-8")

          ignore = Path(".gitignore")
          ignore_text = ignore.read_text(encoding="utf-8")
          addition = '''/android-app/keystore.properties
          /android-app/*.jks
          /android-app/*.keystore
          /android-app/*.p12
          '''
          if "/android-app/keystore.properties" not in ignore_text:
              anchor = "/android-app/local.properties\n"
              if anchor not in ignore_text:
                  raise SystemExit("Android ignore anchor changed unexpectedly")
              ignore_text = ignore_text.replace(anchor, anchor + addition)
          ignore.write_text(ignore_text, encoding="utf-8")
          PY

          cat > android-app/keystore.properties.example <<'PROPERTIES'
          # Copy to android-app/keystore.properties. The real file is ignored by Git.
          storeFile=C:/Users/you/.tasken/tasken-release.jks
          storePassword=<set locally>
          keyAlias=tasken
          keyPassword=<set locally>
          PROPERTIES

          mkdir -p android-app/scripts
          cat > android-app/scripts/build-signed-release.ps1 <<'POWERSHELL'
          [CmdletBinding()]
          param(
              [string]$Keystore = $env:TASKEN_ANDROID_KEYSTORE,
              [string]$KeystorePassword = $env:TASKEN_ANDROID_KEYSTORE_PASSWORD,
              [string]$KeyAlias = $env:TASKEN_ANDROID_KEY_ALIAS,
              [string]$KeyPassword = $env:TASKEN_ANDROID_KEY_PASSWORD
          )

          $required = [ordered]@{
              TASKEN_ANDROID_KEYSTORE = $Keystore
              TASKEN_ANDROID_KEYSTORE_PASSWORD = $KeystorePassword
              TASKEN_ANDROID_KEY_ALIAS = $KeyAlias
              TASKEN_ANDROID_KEY_PASSWORD = $KeyPassword
          }
          $missing = @(
              $required.GetEnumerator() |
                  Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
                  ForEach-Object Key
          )
          if ($missing.Count -gt 0) {
              throw "Release signing is not configured. Missing: $($missing -join ', ')"
          }
          if (-not (Test-Path -LiteralPath $Keystore -PathType Leaf)) {
              throw "Release keystore does not exist: $Keystore"
          }

          $env:TASKEN_ANDROID_KEYSTORE = (Resolve-Path -LiteralPath $Keystore).Path
          $env:TASKEN_ANDROID_KEYSTORE_PASSWORD = $KeystorePassword
          $env:TASKEN_ANDROID_KEY_ALIAS = $KeyAlias
          $env:TASKEN_ANDROID_KEY_PASSWORD = $KeyPassword

          $androidRoot = Split-Path -Parent $PSScriptRoot
          Push-Location $androidRoot
          try {
              & .\gradlew.bat --no-daemon verifyReleaseSigning assembleRelease
              if ($LASTEXITCODE -ne 0) {
                  throw "Gradle release build failed with exit code $LASTEXITCODE"
              }

              $apk = Join-Path $androidRoot "app\build\outputs\apk\release\app-release.apk"
              if (-not (Test-Path -LiteralPath $apk -PathType Leaf)) {
                  throw "Signed release APK was not produced: $apk"
              }

              $sdkRoot = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
              if ($sdkRoot) {
                  $apksigner = Get-ChildItem -Path (Join-Path $sdkRoot "build-tools") -Filter "apksigner.bat" -Recurse -File |
                      Sort-Object { [version]$_.Directory.Name } -Descending |
                      Select-Object -First 1
                  if ($apksigner) {
                      & $apksigner.FullName verify --verbose $apk
                      if ($LASTEXITCODE -ne 0) { throw "apksigner verification failed" }
                  }
              }

              Write-Output (Resolve-Path -LiteralPath $apk).Path
          }
          finally {
              Pop-Location
          }
          POWERSHELL

          cat > docs/android-release-signing.md <<'MARKDOWN'
          # Tasken Android release signing

          Date: 2026-08-22
          Parent: #400

          Tasken release APKs are signed only with user-owned local credentials. No keystore or password is committed.

          ## Configuration sources

          Use one of these sources, in precedence order:

          1. ignored `android-app/keystore.properties`;
          2. Gradle properties;
          3. environment variables.

          | Environment / Gradle property | `keystore.properties` key |
          | --- | --- |
          | `TASKEN_ANDROID_KEYSTORE` | `storeFile` |
          | `TASKEN_ANDROID_KEYSTORE_PASSWORD` | `storePassword` |
          | `TASKEN_ANDROID_KEY_ALIAS` | `keyAlias` |
          | `TASKEN_ANDROID_KEY_PASSWORD` | `keyPassword` |

          Copy `android-app/keystore.properties.example` for the local-file route. The real properties file and common keystore extensions under `android-app/` are ignored.

          ## Create the long-lived key once

          Let `keytool` prompt for secrets instead of writing passwords into shell history:

          ```powershell
          New-Item -ItemType Directory -Force "$HOME\.tasken" | Out-Null
          keytool -genkeypair -v `
            -storetype JKS `
            -keystore "$HOME\.tasken\tasken-release.jks" `
            -alias tasken `
            -keyalg RSA `
            -keysize 4096 `
            -validity 10000
          ```

          Keep multiple secure backups of the keystore and credentials. Future APK updates must use the same application signing key.

          ## Build and verify on Windows

          After configuring the four values, run:

          ```powershell
          .\android-app\scripts\build-signed-release.ps1
          ```

          Output:

          ```text
          android-app/app/build/outputs/apk/release/app-release.apk
          ```

          Release packaging fails before execution when required values are missing or the keystore path is invalid. Debug builds do not require release credentials.

          ## Independent verification

          The implementation CI proves all three properties:

          - debug unit tests, Android-test compilation, and debug APK succeed without secrets;
          - unsigned `assembleRelease` is rejected;
          - a throwaway JKS produces an APK accepted by Android `apksigner`.

          The throwaway CI key is never suitable for the locally installed Tasken app.

          Official guidance:

          - https://developer.android.com/build/build-variants#signing
          - https://developer.android.com/studio/publish/app-signing
          MARKDOWN
      - name: Verify debug builds remain independent of release secrets
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace
      - name: Prove unsigned release packaging fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          set +e
          ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/unsigned-release.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/unsigned-release.log"
            echo "assembleRelease unexpectedly succeeded without signing material"
            exit 1
          fi
          grep -F "Release signing is not configured" "$RUNNER_TEMP/unsigned-release.log"
      - name: Build and verify a signed release with an ephemeral JKS
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/tasken-ci-release.jks" \
            -storepass tasken-ci-store-password \
            -alias tasken-ci \
            -keypass tasken-ci-key-password \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Tasken CI,OU=Verification,O=Tasken,L=Kobe,ST=Hyogo,C=JP"
          cd android-app
          TASKEN_ANDROID_KEYSTORE="$RUNNER_TEMP/tasken-ci-release.jks" \
          TASKEN_ANDROID_KEYSTORE_PASSWORD="tasken-ci-store-password" \
          TASKEN_ANDROID_KEY_ALIAS="tasken-ci" \
          TASKEN_ANDROID_KEY_PASSWORD="tasken-ci-key-password" \
            ./gradlew --no-daemon verifyReleaseSigning assembleRelease --stacktrace
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Commit verified release-signing support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/implement-android-release-signing.yml
          rm -f .github/workflows/implement-android-release-signing-v2.yml
          git add -A
          git commit -m "build(android): add secure signed release APK workflow"
          git push origin HEAD:codex/400-android-release-signing
