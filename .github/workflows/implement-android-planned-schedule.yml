name: Implement Android planned schedule

on:
  push:
    branches:
      - codex/400-android-planned-schedule-v2
    paths:
      - .github/workflows/implement-android-planned-schedule.yml

permissions:
  contents: write

jobs:
  implement-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-planned-schedule-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install desktop dependencies
        run: npm ci

      - name: Apply planned schedule vertical slice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

