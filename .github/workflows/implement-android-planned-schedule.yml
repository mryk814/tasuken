    internal suspend fun updateTaskPlannedScheduleNow(
        task: MobileTask,
        plannedStartTime: String?,
        plannedDurationMinutes: Int?,
    ) {
        val normalizedStartTime = plannedStartTime?.trim()?.takeIf(String::isNotEmpty)
        if (
            normalizedStartTime != null &&
            !Regex("^([01]\\\\d|2[0-3]):[0-5]\\\\d$").matches(normalizedStartTime)
        ) {
            mutableTaskActionState.value = TaskActionUiState.Error(task.id, "開始時刻はHH:mmで入力してください。")
            return
        }
        if (plannedDurationMinutes != null && plannedDurationMinutes !in 1..10080) {
            mutableTaskActionState.value = TaskActionUiState.Error(task.id, "所要時間は1〜10080分で入力してください。")
            return
        }
        if (
            task.plannedStartTime == normalizedStartTime &&
            task.plannedDurationMinutes == plannedDurationMinutes
        ) return
        if (task.pending || task.conflict != null) {
            mutableTaskActionState.value = TaskActionUiState.Error(
                task.id,
                "このTaskの同期を解決してから予定時刻を変更してください。",
            )
            return
        }
        val offlineRepository = repository as? MobileOfflineTaskRepository
        if (offlineRepository == null) {
            mutableTaskActionState.value = TaskActionUiState.Error(
                task.id,
                "この環境ではTaskの予定時刻を変更できません。",
            )
            return
        }
        mutableTaskActionState.value = TaskActionUiState.Saving(task.id)
        mutableTaskActionState.value = try {
            withContext(ioDispatcher) {
                offlineRepository.enqueueUpdateTaskPlannedSchedule(
                    task.id,
                    normalizedStartTime,
                    plannedDurationMinutes,
                )
            }
            TaskActionUiState.Queued(task.id)
        } catch (error: Exception) {
            TaskActionUiState.Error(task.id, error.message ?: "Taskの予定時刻を変更できませんでした。")
        }
    }

