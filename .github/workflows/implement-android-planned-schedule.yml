        assertEquals("所要時間は分単位の整数で入力してください。", parsePlannedScheduleDraft("09:30", "1.5").error)
        assertEquals("所要時間は1〜10080分で入力してください。", parsePlannedScheduleDraft("09:30", "0").error)
    }

