        assertEquals(60, conflict.serverPlannedDurationMinutes)
        assertEquals("10:00", dao.task("task-1")?.plannedStartTime)

        val replacementId = outbox.keepLocal(commandId)
        val replacement = MobileTaskCommandContract.decodeUpdateEnvelope(
            requireNotNull(dao.outbox(replacementId)).envelopeJson,
        )
        assertEquals(5, replacement.command.expectedVersion)
        assertEquals("10:00", replacement.command.base.getValue("plannedStartTime").jsonPrimitive.content)
        assertEquals("09:30", replacement.command.changes.getValue("plannedStartTime").jsonPrimitive.content)
        assertEquals("09:30", dao.task("task-1")?.plannedStartTime)
        assertEquals(90, dao.task("task-1")?.plannedDurationMinutes)
        assertNull(dao.conflict(commandId))
    }
}
''',
