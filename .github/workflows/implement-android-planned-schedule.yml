              '''# Android planned schedule — phase 16

Date: 2026-08-22  
Parent: #400

## Product boundary

Tasken distinguishes two different meanings:

- `todayDate`: the date on which the user wants to pay attention to the Task;
- `planned_start_time` / `planned_duration_minutes`: the intended clock time and effort window.

The Android UI keeps them separate. Changing the planned schedule never moves the Task into or out of Today, and changing Today never rewrites the planned schedule.

## Vertical slice

The Mobile API projects `plannedStartTime` and `plannedDurationMinutes` from the canonical Task read model. Android stores both values in Room and sends them together as one field-level `UpdateTask` intent. The Gateway maps that atomic mobile patch to the canonical snake_case fields.

Both fields remain independently nullable because the canonical Task contract permits a time without a duration and a duration without a time. Android does not invent an additional business rule.

## Offline and conflict behavior

- edits update the Room projection immediately;
- the outbox owns the intent for the confirmed `serverId`;
- retries keep the same command identity;
- a version conflict stores both Desktop and Android values;
- choosing Android creates a new command against the current Desktop version;
- choosing Desktop discards the local schedule intent;
- process recreation retains the editor draft through `rememberSaveable` and retains confirmed/pending values in Room.

## Automated evidence

- strict TypeScript contract validation and canonical Gateway mapping;
- Kotlin draft and command validation;
- ViewModel boundary test proving `todayDate` is unchanged;
- Room migration 7→8;
- Room/outbox/conflict integration test;
- Android JVM tests, androidTest compilation, debug APK;
- API 35 emulator instrumentation in the implementation workflow.

## Remaining local acceptance

On the Fold 7, verify time and duration editing while folded and unfolded, draft continuity during rotation/fold changes, and convergence after the Desktop is stopped and restarted.
