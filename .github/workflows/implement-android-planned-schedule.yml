              """test("Mobile UpdateTask maps planned schedule atomically to canonical fields", async () => {
  const { service } = capability();
  const canonicalCommands = [];
  const adapter = gateway(service, {
    executeTaskCommand: (input) => {
      canonicalCommands.push(input);
      return service.executeCommand(input);
    },
  });
  assert.equal((await adapter.handle({
    method: "POST",
    path: TASKEN_MOBILE_ENDPOINTS.commands,
    principal,
    body: createRequest(),
  })).status, 200);

  const scheduled = await adapter.handle({
    method: "POST",
    path: TASKEN_MOBILE_ENDPOINTS.commands,
    principal,
    body: {
      ...createRequest(),
      requestId: "request-mobile-planned-schedule",
      commandId: "command-mobile-planned-schedule",
      idempotencyKey: "command-mobile-planned-schedule",
      command: {
        name: "UpdateTask",
        taskId: "task-mobile-create",
        expectedVersion: 1,
        changes: { plannedStartTime: "09:30", plannedDurationMinutes: 90 },
        base: { plannedStartTime: null, plannedDurationMinutes: null },
      },
    },
  });
  assert.equal(scheduled.status, 200);
  assert.equal(scheduled.body.data.task.plannedStartTime, "09:30");
  assert.equal(scheduled.body.data.task.plannedDurationMinutes, 90);
  assert.deepEqual(canonicalCommands.at(-1).payload, {
    task_id: "task-mobile-create",
    expected_version: 1,
    changes: { planned_start_time: "09:30", planned_duration_minutes: 90 },
    base: { planned_start_time: null, planned_duration_minutes: null },
  });

  const cleared = await adapter.handle({
    method: "POST",
    path: TASKEN_MOBILE_ENDPOINTS.commands,
    principal,
    body: {
      ...createRequest(),
      requestId: "request-mobile-planned-schedule-clear",
      commandId: "command-mobile-planned-schedule-clear",
      idempotencyKey: "command-mobile-planned-schedule-clear",
      command: {
        name: "UpdateTask",
        taskId: "task-mobile-create",
        expectedVersion: 2,
        changes: { plannedStartTime: null, plannedDurationMinutes: null },
        base: { plannedStartTime: "09:30", plannedDurationMinutes: 90 },
      },
    },
  });
  assert.equal(cleared.status, 200);
  assert.equal(cleared.body.data.task.plannedStartTime, null);
  assert.equal(cleared.body.data.task.plannedDurationMinutes, null);
});

