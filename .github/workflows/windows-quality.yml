name: Windows quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows quality gates
        run: npm run ci

      - name: Package Windows app
        run: npm run package

      - name: Smoke packaged MCP with system Node
        run: npm run smoke:mcp-package

      - name: Upload architecture audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-audit-report
          path: artifacts/architecture
          if-no-files-found: warn
          retention-days: 14
