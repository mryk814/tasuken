name: Implement Android expanded list-detail

on:
  push:
    branches:
      - codex/400-android-expanded-detail
    paths:
      - .github/workflows/implement-android-expanded-detail.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-expanded-detail
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply the width-driven Material 3 Adaptive directive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("android-app/app/src/main/java/jp/personal/tasken/companion/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          old_imports = '''import androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi
          import androidx.compose.material3.adaptive.currentWindowAdaptiveInfo
          import androidx.compose.material3.adaptive.layout.AnimatedPane
          import androidx.compose.material3.adaptive.layout.ListDetailPaneScaffoldRole
          import androidx.compose.material3.adaptive.layout.calculatePaneScaffoldDirective
          '''
          new_imports = '''import androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi
          import androidx.compose.material3.adaptive.currentWindowAdaptiveInfo
          import androidx.compose.material3.adaptive.currentWindowDpSize
          import androidx.compose.material3.adaptive.layout.AnimatedPane
          import androidx.compose.material3.adaptive.layout.ListDetailPaneScaffoldRole
          import androidx.compose.material3.adaptive.layout.PaneScaffoldDirective
          import androidx.compose.material3.adaptive.layout.calculatePaneScaffoldDirective
          '''
          if text.count(old_imports) != 1:
              raise SystemExit("Adaptive import block changed unexpectedly")
          text = text.replace(old_imports, new_imports)

          old_units = '''import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          '''
          new_units = '''import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          '''
          if text.count(old_units) != 1:
              raise SystemExit("Unit import block changed unexpectedly")
          text = text.replace(old_units, new_units)

          marker = '''@OptIn(ExperimentalMaterial3Api::class, ExperimentalMaterial3AdaptiveApi::class)
          @Composable
          private fun TodayApp(
          '''
          helper = '''internal val TaskenDualPaneMinWidth = 700.dp

          @OptIn(ExperimentalMaterial3AdaptiveApi::class)
          internal fun taskenPaneScaffoldDirective(
              base: PaneScaffoldDirective,
              windowWidth: Dp,
          ): PaneScaffoldDirective = if (windowWidth >= TaskenDualPaneMinWidth) {
              base.copy(maxHorizontalPartitions = maxOf(2, base.maxHorizontalPartitions))
          } else {
              base
          }

          @OptIn(ExperimentalMaterial3Api::class, ExperimentalMaterial3AdaptiveApi::class)
          @Composable
          private fun TodayApp(
          '''
          if text.count(marker) != 1:
              raise SystemExit("TodayApp marker changed unexpectedly")
          text = text.replace(marker, helper)

          old_navigator = '''    val paneState = rememberTodayPaneState()
              val adaptiveInfo = currentWindowAdaptiveInfo()
              val navigator = rememberListDetailPaneScaffoldNavigator(
                  scaffoldDirective = calculatePaneScaffoldDirective(adaptiveInfo),
              )
          '''
          new_navigator = '''    val paneState = rememberTodayPaneState()
              val adaptiveInfo = currentWindowAdaptiveInfo()
              val scaffoldDirective = taskenPaneScaffoldDirective(
                  base = calculatePaneScaffoldDirective(adaptiveInfo),
                  windowWidth = currentWindowDpSize().width,
              )
              val navigator = rememberListDetailPaneScaffoldNavigator(
                  scaffoldDirective = scaffoldDirective,
              )
          '''
          if text.count(old_navigator) != 1:
              raise SystemExit("Navigator block changed unexpectedly")
          text = text.replace(old_navigator, new_navigator)
          path.write_text(text, encoding="utf-8")
          PY

          cat > android-app/app/src/test/kotlin/jp/personal/tasken/companion/TaskenAdaptiveDirectiveTest.kt <<'KOTLIN'
          package jp.personal.tasken.companion

          import androidx.compose.material3.adaptive.ExperimentalMaterial3AdaptiveApi
          import androidx.compose.material3.adaptive.layout.PaneScaffoldDirective
          import androidx.compose.ui.geometry.Rect
          import androidx.compose.ui.unit.dp
          import org.junit.Assert.assertEquals
          import org.junit.Test

          @OptIn(ExperimentalMaterial3AdaptiveApi::class)
          class TaskenAdaptiveDirectiveTest {
              @Test
              fun unfoldedFoldWidthEnablesTwoHorizontalPanes() {
                  val directive = taskenPaneScaffoldDirective(
                      base = PaneScaffoldDirective.Default,
                      windowWidth = 750.dp,
                  )

                  assertEquals(2, directive.maxHorizontalPartitions)
              }

              @Test
              fun narrowWindowKeepsTheOfficialDirective() {
                  val base = PaneScaffoldDirective.Default.copy(
                      horizontalPartitionSpacerSize = 12.dp,
                  )

                  assertEquals(base, taskenPaneScaffoldDirective(base, 699.dp))
              }

              @Test
              fun expandedOverridePreservesHingeExclusionsAndSpacing() {
                  val excludedBounds = listOf(Rect(360f, 0f, 390f, 900f))
                  val base = PaneScaffoldDirective.Default.copy(
                      horizontalPartitionSpacerSize = 18.dp,
                      excludedBounds = excludedBounds,
                  )
                  val directive = taskenPaneScaffoldDirective(base, 750.dp)

                  assertEquals(2, directive.maxHorizontalPartitions)
                  assertEquals(18.dp, directive.horizontalPartitionSpacerSize)
                  assertEquals(excludedBounds, directive.excludedBounds)
              }
          }
          KOTLIN

          cat > docs/android-expanded-list-detail-phase15.md <<'MARKDOWN'
          # Android expanded list-detail — phase 15

          Date: 2026-08-22
          Parent: #400

          ## Problem

          Tasken already used `NavigableListDetailPaneScaffold`, but the library's standard Medium-width directive remained single-pane. The unfolded Galaxy Z Fold 7 reports about 750dp in the verified configuration, so list and detail did not coexist even though both were usable at that width.

          ## Decision

          Keep Material 3 Adaptive as the layout engine and retain its calculated posture, hinge exclusions, spacers, and default pane sizing. Override only `maxHorizontalPartitions` when the current **window width** is at least 700dp.

          This is deliberately window-driven rather than model-, orientation-, or pixel-driven:

          - below 700dp: preserve the official directive unchanged;
          - 700dp and wider: permit at least two horizontal partitions;
          - any stronger directive or hinge exclusion calculated by Android is preserved.

          The 700dp boundary leaves enough space for a useful list pane and editable detail pane while covering the unfolded Fold 7 portrait window. It does not force two panes into ordinary 600dp Medium windows.

          ## Automated evidence

          `TaskenAdaptiveDirectiveTest` verifies:

          - 750dp enables two panes;
          - 699dp preserves the official directive;
          - hinge exclusions and partition spacing survive the override.

          The implementation job runs `testDebugUnitTest`, `compileDebugAndroidTestKotlin`, and `assembleDebug` before committing.

          ## Remaining local acceptance

          On Fold 7, verify folded/unfolded and rotation continuity for selected Task, list scroll, edit draft, and open Theme menu. The implementation contains no Galaxy-specific branch.

          References:

          - https://developer.android.com/develop/adaptive-apps/guides/list-detail
          - https://developer.android.com/reference/kotlin/androidx/compose/material3/adaptive/layout/PaneScaffoldDirective
          MARKDOWN
      - name: Verify Android unit, instrumentation compilation, and debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace
      - name: Commit the verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/implement-android-expanded-detail.yml
          git add -A
          git commit -m "feat(android): show list and detail on unfolded Fold widths"
          git push origin HEAD:codex/400-android-expanded-detail
