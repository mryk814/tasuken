name: Android quality

on:
  pull_request:
    paths:
      - ".github/workflows/android-quality.yml"
      - "android-app/**"
      - "contracts/mobile/**"
      - "src/main/gateway/mobile/**"
      - "src/shared/contracts/mobile/**"
      - "src/shared/contracts/task/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-quality.yml"
      - "android-app/**"
      - "contracts/mobile/**"
      - "src/main/gateway/mobile/**"
      - "src/shared/contracts/mobile/**"
      - "src/shared/contracts/task/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify JVM tests, instrumentation sources, and debug APK
        shell: bash
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon \
            testDebugUnitTest \
            compileDebugAndroidTestKotlin \
            assembleDebug \
            --stacktrace

      - name: Upload unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android-app/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
