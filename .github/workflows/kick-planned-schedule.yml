name: Kick planned schedule implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kick-planned-schedule.yml
      - .github/workflows/implement-android-planned-schedule.yml

permissions:
  contents: write

jobs:
  implement-verify-and-commit:
    if: github.head_ref == 'codex/400-android-planned-schedule-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/400-android-planned-schedule-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install desktop dependencies
        run: npm ci

      - name: Apply implementation embedded in the staging workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/implement-android-planned-schedule.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()

          script_lines = []
          active_quote = None
          for line in lines:
              if active_quote is not None:
                  if active_quote in line:
                      script_lines.append(line[10:] if line.startswith("          ") else line)
                      active_quote = None
                  else:
                      script_lines.append(line)
                  continue

              executable = line[10:] if line.startswith("          ") else line
              script_lines.append(executable)
              for quote in ('"""', "'''"):
                  if executable.count(quote) % 2 == 1:
                      active_quote = quote
                      break

          if active_quote is not None:
              raise SystemExit(f"unterminated embedded Python string: {active_quote}")

          # The current DTO imports JsonPrimitive directly and does not yet use
          # jsonPrimitive. Seed the one extension needed by the generated strict
          # integer validator; the embedded script then treats it as already set.
          command_dto = Path(
              'android-app/app/src/main/java/jp/personal/tasken/companion/MobileCommandDto.kt'
          )
          command_text = command_dto.read_text(encoding='utf-8')
          import_anchor = 'import kotlinx.serialization.json.JsonPrimitive\n'
          if 'import kotlinx.serialization.json.intOrNull\n' not in command_text:
              if command_text.count(import_anchor) != 1:
                  raise SystemExit('MobileCommandDto JsonPrimitive import anchor changed')
              command_text = command_text.replace(
                  import_anchor,
                  import_anchor + 'import kotlinx.serialization.json.intOrNull\n',
              )
              command_dto.write_text(command_text, encoding='utf-8')

          script = "\n".join(script_lines)
          exec(compile(script, 'planned-schedule-implementation.py', 'exec'))

          # Normalize two generator-level details before compilation.
          command_text = command_dto.read_text(encoding='utf-8').replace(
              'duration.intOrNull in 1..10080',
              'duration.intOrNull?.let { it in 1..10080 } == true',
          )
          command_dto.write_text(command_text, encoding='utf-8')

          editor = Path(
              'android-app/app/src/main/java/jp/personal/tasken/companion/TaskScheduleEditor.kt'
          )
          editor.write_text(
              editor.read_text(encoding='utf-8').replace(r'\\\\d', r'\\d'),
              encoding='utf-8',
          )
          EXTRACT

      - name: Verify desktop contract and Gateway mapping
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node scripts/run-electron-node.mjs --test --test-concurrency=1 tests/mobile-gateway-phase4a.test.mjs

      - name: Verify Android JVM, instrumentation compilation, and APK
        shell: bash
        working-directory: android-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace

      - name: Run Android API 35 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_8
          disable-animations: true
          script: cd android-app && ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace

      - name: Commit verified planned schedule slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/implement-android-planned-schedule.yml
          rm .github/workflows/kick-planned-schedule.yml
          git add -A
          git commit -m "feat(android): edit planned task schedule offline"
          git push origin HEAD:codex/400-android-planned-schedule-v2
