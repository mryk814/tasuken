name: Android release signing

on:
  pull_request:
    paths:
      - .github/workflows/android-release-signing.yml
      - android-app/app/build.gradle.kts
      - android-app/keystore.properties.example
      - android-app/scripts/build-signed-release.ps1
      - .gitignore
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-release-signing.yml
      - android-app/app/build.gradle.kts
      - android-app/keystore.properties.example
      - android-app/scripts/build-signed-release.ps1
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify debug builds require no release credentials
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace

      - name: Prove unsigned release packaging fails closed
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          set +e
          ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/unsigned-release.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/unsigned-release.log"
            echo "assembleRelease unexpectedly succeeded without signing material"
            exit 1
          fi
          grep -F "Release signing is not configured" "$RUNNER_TEMP/unsigned-release.log"

      - name: Build and verify a rotated signed release with ephemeral JKS files
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/tasken-ci-legacy.jks" \
            -storepass tasken-ci-legacy-password \
            -alias tasken-ci-legacy \
            -keypass tasken-ci-legacy-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Tasken Legacy CI,OU=Verification,O=Tasken,L=Kobe,ST=Hyogo,C=JP"

          keytool -genkeypair \
            -storetype JKS \
            -keystore "$RUNNER_TEMP/tasken-ci-release.jks" \
            -storepass tasken-ci-store-password \
            -alias tasken-ci \
            -keypass tasken-ci-key-password \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Tasken CI,OU=Verification,O=Tasken,L=Kobe,ST=Hyogo,C=JP"

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" rotate \
            --out "$RUNNER_TEMP/tasken-ci-lineage" \
            --old-signer \
            --ks "$RUNNER_TEMP/tasken-ci-legacy.jks" \
            --ks-key-alias tasken-ci-legacy \
            --ks-pass pass:tasken-ci-legacy-password \
            --key-pass pass:tasken-ci-legacy-password \
            --set-installed-data true \
            --set-permission true \
            --set-rollback false \
            --new-signer \
            --ks "$RUNNER_TEMP/tasken-ci-release.jks" \
            --ks-key-alias tasken-ci \
            --ks-pass pass:tasken-ci-store-password \
            --key-pass pass:tasken-ci-key-password

          cd android-app
          TASKEN_ANDROID_KEYSTORE="$RUNNER_TEMP/tasken-ci-release.jks" \
          TASKEN_ANDROID_KEYSTORE_PASSWORD="tasken-ci-store-password" \
          TASKEN_ANDROID_KEY_ALIAS="tasken-ci" \
          TASKEN_ANDROID_KEY_PASSWORD="tasken-ci-key-password" \
            ./gradlew --no-daemon verifyReleaseSigning assembleRelease --stacktrace

          apk="app/build/outputs/apk/release/app-release.apk"
          rotated_apk="app/build/outputs/apk/release/app-release-rotated.apk"
          test -f "$apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/tasken-ci-legacy.jks" \
            --ks-key-alias tasken-ci-legacy \
            --ks-pass pass:tasken-ci-legacy-password \
            --key-pass pass:tasken-ci-legacy-password \
            --next-signer \
            --ks "$RUNNER_TEMP/tasken-ci-release.jks" \
            --ks-key-alias tasken-ci \
            --ks-pass pass:tasken-ci-store-password \
            --key-pass pass:tasken-ci-key-password \
            --lineage "$RUNNER_TEMP/tasken-ci-lineage" \
            --rotation-min-sdk-version 33 \
            --out "$rotated_apk" \
            "$apk"
          "$apksigner" verify --verbose --print-certs --min-sdk-version 26 "$rotated_apk"

  build-permanent-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing material for this runner only
        shell: pwsh
        env:
          RELEASE_JKS_BASE64: ${{ secrets.TASKEN_ANDROID_KEYSTORE_BASE64 }}
          LEGACY_JKS_BASE64: ${{ secrets.TASKEN_ANDROID_LEGACY_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.TASKEN_ANDROID_SIGNING_LINEAGE_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RELEASE_JKS_BASE64 -or -not $env:LEGACY_JKS_BASE64 -or -not $env:SIGNING_LINEAGE_BASE64) {
            throw "Permanent Android signing material is not configured."
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\tasken-release.jks", [Convert]::FromBase64String($env:RELEASE_JKS_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\tasken-legacy-debug.jks", [Convert]::FromBase64String($env:LEGACY_JKS_BASE64))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\tasken-signing-lineage", [Convert]::FromBase64String($env:SIGNING_LINEAGE_BASE64))

      - name: Build permanent signed release APK
        shell: pwsh
        env:
          TASKEN_ANDROID_KEYSTORE: ${{ runner.temp }}\tasken-release.jks
          TASKEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TASKEN_ANDROID_KEYSTORE_PASSWORD }}
          TASKEN_ANDROID_KEY_ALIAS: ${{ secrets.TASKEN_ANDROID_KEY_ALIAS }}
          TASKEN_ANDROID_KEY_PASSWORD: ${{ secrets.TASKEN_ANDROID_KEY_PASSWORD }}
          TASKEN_ANDROID_LEGACY_KEYSTORE: ${{ runner.temp }}\tasken-legacy-debug.jks
          TASKEN_ANDROID_LEGACY_KEYSTORE_PASSWORD: ${{ secrets.TASKEN_ANDROID_LEGACY_KEYSTORE_PASSWORD }}
          TASKEN_ANDROID_LEGACY_KEY_ALIAS: ${{ secrets.TASKEN_ANDROID_LEGACY_KEY_ALIAS }}
          TASKEN_ANDROID_LEGACY_KEY_PASSWORD: ${{ secrets.TASKEN_ANDROID_LEGACY_KEY_PASSWORD }}
          TASKEN_ANDROID_SIGNING_LINEAGE: ${{ runner.temp }}\tasken-signing-lineage
          TASKEN_ANDROID_ROTATION_MIN_SDK_VERSION: "33"
        run: .\android-app\scripts\build-signed-release.ps1

      - name: Upload permanent signed APK
        uses: actions/upload-artifact@v4
        with:
          name: tasken-android-release-${{ github.sha }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
