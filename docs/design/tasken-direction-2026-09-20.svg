<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1680" viewBox="0 0 1800 1680" role="img" aria-labelledby="title desc">
  <title id="title">TaskenのFeed、Agent Desk、Today、Androidの画面構成案</title>
  <desc id="desc">2026年9月20日の設計提案。架空の研究業務データを使った静的な図。上段は広幅のFeedと質問への回答。下段はAgent Desk、Today、狭幅Androidの成果確認。既存のburgundyとクリーム色のトークンを使用する。</desc>
  <defs>
    <style>
      :root { --color-bg:#ECE2DF; --color-surface:#FFFFFF; --color-surface-subtle:#F7F1F1; --color-text:#26201E; --color-text-secondary:#7C746E; --color-border:#DCC1C4; --color-border-subtle:#ECE0DE; --color-accent:#8A2F3B; --color-selected:#FBF3F4; --color-ai:#1C557D; --color-ai-bg:#E8F1F8; --color-blocked:#8A5212; --color-blocked-bg:#FBF0DD; --color-review:#564AA8; --color-review-bg:#EEEBFA; }
      text { font-family:"Nunito Variable","Noto Sans JP Variable","Yu Gothic UI",sans-serif; fill:var(--color-text); font-size:16px; }
      .bg { fill:var(--color-bg); } .surface { fill:var(--color-surface); } .subtle { fill:var(--color-surface-subtle); }
      .border { stroke:var(--color-border); stroke-width:1; } .rule { stroke:var(--color-border-subtle); stroke-width:1; }
      .title { font-size:30px; font-weight:700; } .section { font-size:22px; font-weight:700; }
      .h { font-size:18px; font-weight:700; } .bold { font-weight:700; }
      .small { font-size:14px; } .caption { font-size:13px; } .muted { fill:var(--color-text-secondary); }
      .accent { fill:var(--color-accent); } .ai { fill:var(--color-ai); } .review { fill:var(--color-review); }
      .blocked { fill:var(--color-blocked); } .white { fill:#FFFFFF; } .mono { font-variant-numeric:tabular-nums; }
      .button { fill:var(--color-surface); stroke:var(--color-border); stroke-width:1; }
      .lineicon { fill:none; stroke:var(--color-text-secondary); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <symbol id="agent" viewBox="0 0 32 32"><rect x="6" y="9" width="20" height="17" rx="5" class="lineicon"/><path d="M16 5v4M12 21h8" class="lineicon"/><circle cx="12" cy="16" r="1.5" fill="#1C557D"/><circle cx="20" cy="16" r="1.5" fill="#1C557D"/></symbol>
    <symbol id="note" viewBox="0 0 32 32"><path d="M8 5h12l5 5v17H8zM19 5v6h6M12 16h9M12 21h9" class="lineicon"/></symbol>
    <symbol id="task" viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="20" rx="5" class="lineicon"/><path d="m11 16 4 4 7-8" class="lineicon"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="#7C746E"/><circle cx="12" cy="12" r="1.5" fill="#7C746E"/><circle cx="19" cy="12" r="1.5" fill="#7C746E"/></symbol>
  </defs>

