<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasken Web Artifact Demo</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 720px; margin: 0 auto; padding: 32px; background: #fffaf1; color: #30252a; }
      .card { padding: 24px; border: 1px solid #e7d9c7; border-radius: 16px; background: white; }
      button, a { display: inline-block; margin: 6px 6px 6px 0; padding: 8px 12px; border-radius: 8px; }
      button { border: 1px solid #8a2f3b; background: #8a2f3b; color: white; cursor: pointer; }
      a { color: #8a2f3b; }
      canvas { display: block; width: 100%; max-width: 520px; margin-top: 16px; border: 1px solid #e7d9c7; border-radius: 8px; }
      code { padding: 2px 5px; border-radius: 4px; background: #f4eadb; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Web Artifact Preview Demo</h1>
      <p>Staticでは下のJavaScript操作が無効、Interactiveで明示するとカウンターとCanvasが動きます。</p>
      <p>外部リンク・form・popupは、どちらのモードでもアプリ外へ出ないことを確認できます。</p>

      <button id="increment" type="button">カウントアップ</button>
      <button id="popup" type="button">Popupを試す</button>
      <a href="https://example.com/">外部リンクを試す</a>
      <p>Count: <strong id="count">0</strong></p>

      <form action="https://example.com/submit" method="post">
        <button type="submit">外部formを試す</button>
      </form>

      <canvas id="chart" width="520" height="180" aria-label="Interactive Canvas demo"></canvas>
    </main>

    <script>
      const count = document.querySelector("#count");
      let value = 0;
      document.querySelector("#increment").addEventListener("click", () => {
        value += 1;
        count.textContent = String(value);
        draw();
      });
      document.querySelector("#popup").addEventListener("click", () => {
        window.open("https://example.com/", "_blank", "popup");
      });

      function draw() {
        const canvas = document.querySelector("#chart");
        const context = canvas.getContext("2d");
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#8a2f3b";
        context.fillRect(24, 136 - value * 8, 64, value * 8);
        context.fillStyle = "#30252a";
        context.font = "16px system-ui";
        context.fillText("Canvas works only in Interactive Preview", 112, 92);
      }

      draw();
    </script>
  </body>
</html>
